const $ = selector => document.querySelector(selector);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shiftDate(offset, from = today()) { const d = new Date(`${from}T12:00:00`); d.setDate(d.getDate()+offset); return localDate(d); }
function weekRange() { const d = new Date(); d.setDate(d.getDate()-(d.getDay()+6)%7); const begin = localDate(d); return [begin,shiftDate(6,begin)]; }
const dateOK = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(new Date(`${value}T12:00:00`).getTime()) && localDate(new Date(`${value}T12:00:00`)) === value;
const formatNumber = value => Number(value || 0).toLocaleString('zh-CN',{maximumFractionDigits:1});

function initialData() {

function normalizeData(input) {
 const source=input?.data || input;
 if(!source||!Array.isArray(source.people)||!Array.isArray(source.tasks))throw Error('看板数据格式无效');
 const people=initialData().people.map(p=>({...p,role:String(source.people.find(x=>x.id===p.id)?.role || '待设置')}));
 const known=new Set(people.map(p=>p.id));const ids=new Set();
 const tasks=source.tasks.map(t=>{
  if(!t.id||ids.has(t.id)||!known.has(t.owner)||!STATUSES.includes(t.status)||!BOARDS.includes(t.board)||!dateOK(t.due)||!String(t.name || '').trim())throw Error(`任务 ${t.id || ''} 的主责、编号、交期或状态无效`);
  ids.add(t.id);
  const oldDate=(t.history || []).find(h=>String(h.text || '').includes('交办'))?.date?.slice(0,10);
  const assignedAt=dateOK(t.assignedAt)?t.assignedAt:dateOK(oldDate)?oldDate:'';
  const closedAt=t.status==='已完成'&&dateOK(t.closedAt)?t.closedAt:'';
  const allocationIDs=[...new Set([t.owner,...(t.allocations || []).map(a=>a.person)])];
  if(allocationIDs.some(id=>!known.has(id)))throw Error(`任务 ${t.id} 含无效协同人员`);
  return {id:String(t.id),name:String(t.name),board:t.board,owner:t.owner,due:t.due,assignedAt,closedAt,archived:t.status==='已完成'&&Boolean(t.archived),important:Boolean(t.important),urgent:Boolean(t.urgent),key:Boolean(t.key),status:t.status,deliverable:String(t.deliverable || ''),resultLink:String(t.resultLink || ''),docLink:String(t.docLink || ''),allocations:allocationIDs.map(id=>({person:id,role:id===t.owner?'主责':'协同'})),milestones:(t.milestones || []).map(m=>({name:String(m.name || '节点'),done:Boolean(m.done)})),history:Array.isArray(t.history)?t.history:[],updatedAt:String(t.updatedAt || '')};
 });
 const notices=Array.isArray(source.notices)?source.notices:[],requests=Array.isArray(source.requests)?source.requests:[];
 for(const n of notices){if(!n.id||!n.title||!n.content||(n.expiry&&!dateOK(n.expiry)))throw Error('公告数据或日期无效');}
 for(const r of requests){if(!r.id||!r.name||!BOARDS.includes(r.board)||(r.due&&!dateOK(r.due)))throw Error('需求数据或日期无效');}
 return {people,tasks,notices,requests,settings:{teamDocUrl:String(source.settings?.teamDocUrl || ''),baseUrl:String(source.settings?.baseUrl || '')}};
}
let startupWarning='';

prefs.view='overview';prefs.page=0;
const ui={pageDirty:false,selected:new Set(),dialog:null,scroll:{},dirty:false,editToken:null,importData:null,pending:null,conflict:null,saveError:'',storageChanged:false,toastTimer:null,accounts:[],writing:false,feishu:null};

const isManager = () => profile?.role==='supervisor'&&profile?.status==='active';
const canEdit = task => isManager() || task.owner===prefs.actor;
const isActive = task => task.status!=='已完成';

const overdue = task => isActive(task) && Boolean(task.due) && task.due<today();
function progress(task) { if(task.status==='已完成')return 100;return task.milestones.length?Math.round(task.milestones.filter(m=>m.done).length/task.milestones.length*100):0; }

function log(task,text) {task.updatedAt=timestamp();task.history.push({date:task.updatedAt,text,author:person(prefs.actor).name});}
function validLink(value) {if(!value)return true;try{const url=new URL(value);return url.protocol==='https:';}catch{return false;}}
function linkHTML(url,label) {return url && validLink(url)?`<a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`:'';}
function options(values,selected,includeAll='') {
 const first=includeAll?`<option value="all">${includeAll}</option>`:'';
 return first+values.map(v=>`<option value="${escapeHTML(v)}" ${v===selected?'selected':''}>${escapeHTML(v)}</option>`).join('');
}
function peopleOptions(selected,blank='') {return (blank?`<option value="">${blank}</option>`:'')+data.people.map(p=>`<option value="${escapeHTML(p.id)}" ${p.id===selected?'selected':''}>${escapeHTML(p.name)}</option>`).join('');}
function statusHTML(task) {const color={'未开始':'','进行中':'blue','阻塞':'red','待验收':'blue','已完成':'green'}[task.status];return `<span class="pill ${color}">${task.status==='未开始'?'待接收':task.status}</span>`;}
function dueHTML(task) {const color=overdue(task)?'red':isActive(task)&&task.due<=shiftDate(3)?'orange':'';return `<span class="pill ${color}">${shortDate(task.due)}${overdue(task)?' · 逾期':color?' · 临期':''}</span>`;}
function remember() {try{localStorage.setItem(PREFS,JSON.stringify(prefs));}catch{}}
function showToast(message,undo=false) {
 $('#toast').innerHTML=`<span>${escapeHTML(message)}</span>${undo?'<button data-act="undo">撤销</button>':''}`;
 $('#toast').classList.remove('hidden');clearTimeout(ui.toastTimer);
 ui.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),undo?9000:4500);
}
function setSaveState(message,error=false) {$('#saveState').textContent=message;$('#saveState').classList.toggle('error',error);}
function snapshot(label,source=data) {return {id:uid('backup'),label,at:timestamp(),actor:prefs.actor,role:prefs.role,data:clone(source)};}
async function readLatest(){return await rpc('ec_board_get_state');}
async function publishLocal(next,label,baseToken=envelope.token,undoStack=null) {
 if(ui.writing){showToast('正在保存，请稍候');return false;}
 ui.writing=true;setSaveState('云端保存中…');
 const oldSnapshot=snapshot(label);
 try {
  const answer=await rpc('ec_board_apply_changes',{p_revision:Number(baseToken),p_data:normalizeData(next),p_action:label});
  const undo=undoStack || [...envelope.undo,oldSnapshot].slice(-15);
  envelope={...answer,token:String(answer.revision),data:normalizeData(answer),undo,backups:envelope.backups};data=envelope.data;
  ui.pending=null;ui.saveError='';ui.storageChanged=false;
  setSaveState('云端已保存 · '+new Date(answer.savedAt).toLocaleTimeString('zh-CN',{hour12:false}));
  render();showToast(label,isManager());
  if(isManager()){rpc('ec_board_backups').then(backups=>{envelope.backups=backups;if(prefs.view==='admin'&&!ui.dialog)render();}).catch(()=>{});}
  return true;
 } catch(error) {
  if(['40001','PT409'].includes(error.code)){try{showConflict(next,label,await readLatest());}catch(inner){showToast(inner.message);}return false;}
  ui.pending={next:clone(next),label,baseToken,undoStack};ui.saveError=error.message;
  setSaveState('保存失败 · 修改保留待重试',true);renderBanner();
  const feedback=$('#formFeedback');if(feedback)feedback.textContent=error.message;
  return false;
 } finally {ui.writing=false;}
}
async function commit(label,mutate) {
 const next=clone(data);
 try {mutate(next);}catch(error){showToast(error.message);return false;}
 return publishLocal(next,label,ui.dialog?ui.editToken:envelope.token);
}
function renderBanner() {
 if(ui.saveError) $('#banner').innerHTML=`<div class="retry-banner"><span>保存失败，修改已保留。${escapeHTML(ui.saveError)}</span><button data-act="retry">重试保存</button></div>`;
 else if(ui.storageChanged) $('#banner').innerHTML='<div class="retry-banner"><span>其他成员已更新数据。当前填写内容已保留，保存时将核对版本。</span><button data-act="reload-data">读取最新数据</button></div>';
 else if(startupWarning) $('#banner').innerHTML=`<p class="note warning">${escapeHTML(startupWarning)}</p>`;
 else $('#banner').innerHTML='';
}
async function undo() {
 const entry=envelope.undo.at(-1);if(!entry)return showToast('暂无可撤销的操作');
 const changed=normalizeData(entry.data);
 if (!isManager()) {
  if(entry.actor!==prefs.actor || entry.role!=='member')return showToast('该操作由主管或原操作人撤销');
  const original=data.tasks.filter(t=>t.owner!==prefs.actor);
  const restored=changed.tasks.filter(t=>t.owner!==prefs.actor);
  if(JSON.stringify(original)!==JSON.stringify(restored)||JSON.stringify(changed.people)!==JSON.stringify(data.people)||JSON.stringify(changed.notices)!==JSON.stringify(data.notices))return showToast('该操作需主管撤销');
 }
 if(await publishLocal(changed,`撤销 ${entry.label}`,envelope.token,envelope.undo.slice(0,-1)))showToast('已撤销，操作前数据已自动备份');
}
function filteredTasks() {
 const [start,end]=weekRange(),search=prefs.search.trim().toLowerCase();
 return data.tasks.filter(t=>{
  if(prefs.board!=='all'&&t.board!==prefs.board)return false;
  if(prefs.status!=='all'&&t.status!==prefs.status)return false;
  if(search&&![t.id,t.name,t.board,t.deliverable,...t.allocations.map(a=>person(a.person).name)].join(' ').toLowerCase().includes(search))return false;
  if(prefs.quick==='week')return isActive(t)&&t.due>=start&&t.due<=end;
  if(prefs.quick==='overdue')return overdue(t);
  if(prefs.quick==='blocked')return t.status==='阻塞';
  if(prefs.quick==='review')return t.status==='待验收';
  return true;
 }).sort((a,b)=>prefs.sort==='assigned'?b.assignedAt.localeCompare(a.assignedAt):prefs.sort==='owner'?a.owner.localeCompare(b.owner):a.due.localeCompare(b.due));
}
function filtersHTML(){
 return `<div class="filters"><input id="search" type="search" aria-label="搜索成员、任务或编号" placeholder="搜索成员 / 任务 / 编号" value="${escapeHTML(prefs.search)}"><select id="boardFilter" aria-label="业务筛选">${options(BOARDS,prefs.board,'全部业务')}</select><select id="statusFilter" aria-label="状态筛选">${options(STATUSES,prefs.status,'全部状态')}</select><select id="sortFilter" aria-label="排序方式"><option value="due" ${prefs.sort==='due'?'selected':''}>交期优先</option><option value="assigned" ${prefs.sort==='assigned'?'selected':''}>最新交办</option><option value="owner" ${prefs.sort==='owner'?'selected':''}>按员工</option></select><button data-act="clear-filter">重置</button></div><div class="quick">${[['all','全部'],['week','本周到期'],['overdue','逾期'],['blocked','阻塞'],['review','待验收']].map(([key,label])=>`<button class="small ${prefs.quick===key?'active':''}" data-quick="${key}">${label}</button>`).join('')}</div>`;
}
function batchHTML() {return isManager()&&ui.selected.size?`<div class="batch-bar"><strong>已选 ${ui.selected.size} 项任务</strong><div class="actions"><button class="small primary" data-act="batch">批量调整</button><button class="small" data-act="select-visible">选中筛选结果</button><button class="small" data-act="select-clear">取消选择</button></div></div>`:'';}
function selectionHTML(task) {return isManager()?`<input type="checkbox" data-select="${escapeHTML(task.id)}" aria-label="选择任务 ${escapeHTML(task.name)}" ${ui.selected.has(task.id)?'checked':''}>`:'<span></span>';}

function taskRowHTML(t){
 return `<tr>${isManager()?`<td>${selectionHTML(t)}</td>`:''}<td class="task-cell"><button class="task-title" data-task="${escapeHTML(t.id)}">${escapeHTML(t.name)}</button><small>${t.board} · ${quadrant(t)}${t.key?' · 重点':''}</small></td><td>${escapeHTML(person(t.owner).name)}</td><td>${t.assignedAt || '历史未记录'}</td><td>${dueHTML(t)}</td><td>${t.closedAt || '—'}</td><td>${statusHTML(t)}</td><td><div class="actions"><button class="small plain" data-task="${escapeHTML(t.id)}">${canEdit(t)&&isActive(t)?'更新':'查看'}</button>${ui.feishu?.tasks?.[t.id]?.record_url?linkHTML(ui.feishu.tasks[t.id].record_url,'飞书'):''}${t.status==='已完成'&&canEdit(t)?`<button class="small plain" data-archive-task="${escapeHTML(t.id)}">${t.archived?'移出归档':'归档'}</button>`:''}</div></td></tr>`;
}
function tableHTML(tasks,archive=false){
 const pageSize=Math.max(5,Math.min(16,Math.floor((window.innerHeight-350)/42)));
 const pages=Math.max(1,Math.ceil(tasks.length/pageSize));
 if(!archive)prefs.page=Math.min(Math.max(prefs.page,0),pages-1);
 const slice=archive?tasks:tasks.slice(prefs.page*pageSize,(prefs.page+1)*pageSize);
 return `<div class="table-scroll"><table class="compact-table"><thead><tr>${isManager()?'<th></th>':''}<th>任务 / 业务</th><th>主责员工</th><th>交办日期</th><th>计划交付</th><th>关闭日期</th><th>状态</th><th>操作</th></tr></thead><tbody>${slice.map(taskRowHTML).join('') || `<tr><td colspan="8" class="empty">暂无匹配任务${isManager()?'，点击右上角交办任务':''}</td></tr>`}</tbody></table></div>${!archive?`<div class="pagination"><small>共 ${tasks.length} 项 · ${prefs.page+1} / ${pages} 页</small><div><button class="small" data-page="-1" ${prefs.page===0?'disabled':''}>上一页</button><button class="small" data-page="1" ${prefs.page>=pages-1?'disabled':''}>下一页</button></div></div>`:''}`;
}

 return `<details class="archive-panel" id="archivePanel" ${prefs.archiveOpen?'open':''}><summary>已归档任务 <span class="pill">${archived.length}</span></summary>${tableHTML(archived,true)}</details>`;

function noticesHTML() {
 const notices=data.notices.filter(n=>!n.archived&&(!n.expiry || n.expiry>=today())).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||String(b.createdAt).localeCompare(String(a.createdAt)));
 return `<div class="section-head"><h2>团队公告</h2>${isManager()?'<button class="small" data-act="notice">＋ 发布公告</button>':''}</div><section class="panel">${notices.map(n=>`<article class="notice"><div><details><summary>${n.pinned?'<span class="pill blue">置顶</span> ':''}${escapeHTML(n.title)}</summary><p>${escapeHTML(n.content)}</p></details><small>${escapeHTML(n.author || '主管')} · ${shortDate(n.createdAt)}${n.expiry?' · 有效至 '+n.expiry:''}</small></div>${isManager()?`<div class="actions"><button class="small plain" data-notice="${escapeHTML(n.id)}">编辑</button><button class="small plain" data-archive="${escapeHTML(n.id)}">归档</button></div>`:''}</article>`).join('') || '<div class="empty">暂无有效公告</div>'}</section>`;
}
function overviewHTML(){
 const tasks=filteredTasks().filter(t=>!t.archived);
 return `${kpisHTML()}${filtersHTML()}${batchHTML()}<section class="workspace">${tableHTML(tasks)}</section>${archiveHTML()}<details class="notice-panel"><summary>团队公告 <span class="pill">${data.notices.filter(n=>!n.archived&&(!n.expiry||n.expiry>=today())).length}</span></summary>${noticesHTML()}</details>`;

 const tasks=filteredTasks().filter(t=>isActive(t)&&!t.archived);

function assignmentHTML(){
 const tabs=[['all','全部在办'],['未开始','待接收'],['进行中','进行中'],['阻塞','阻塞'],['待验收','待验收'],['已完成','已关闭']];

async function saveTask(nextStatus) {
 if(ui.milestoneWrite)await ui.milestoneWrite;
 if(ui.dialog!=='task')return;
 const original=data.tasks.find(t=>t.id===ui.taskID);if(!original||!canEdit(original)||!formValid())return;
 if(!isManager()&&nextStatus==='已完成')return formError('任务关闭由主管验收');
 if(!isManager()&&['待验收','已完成'].includes(original.status)&&nextStatus==='进行中')return formError('退回和重新开启由主管操作');
 const result=original.status==='已完成'?original.resultLink:String(formValue('resultLink') || '').trim(),note=String(formValue('note') || '').trim();
 const status=nextStatus || original.status;
 if(status==='待验收'&&!result)return formError('提交验收前请填写成果链接或编号');
 if(status==='阻塞'&&!note)return formError('请填写阻塞原因及所需支持');
 if(original.status==='待验收'&&status==='进行中'&&!note)return formError('请填写退回意见');
 if(status==='已完成'&&original.status!=='待验收')return formError('请先提交验收，再关闭任务');
 if(/^https?:/i.test(result)&&!validLink(result))return formError('成果链接需使用有效的 HTTPS 地址');
 const updated=clone(original);
 updated.resultLink=result;updated.status=status;if(status==='已完成'&&original.status!=='已完成')updated.closedAt=today();if(status!=='已完成'){updated.closedAt='';updated.archived=false;}
 updated.milestones.forEach((m,i)=>{m.done=status==='已完成'||Boolean(document.querySelector(`[data-milestone="${i}"]`)?.checked);});
 if(isManager()) {
  const fields=new FormData($('#editForm'));
  const name=String(fields.get('name')).trim(),deliverable=String(fields.get('deliverable')).trim(),doc=String(fields.get('docLink')).trim();
  if(!name||!deliverable)return formError('任务名称与交付物不能为空');
  if(!validLink(doc))return formError('任务依据需填写有效 HTTPS 链接');
  const newOwner=String(fields.get('owner'));
  const changes=[];
  if(newOwner!==original.owner)changes.push(`主责 ${person(original.owner).name} → ${person(newOwner).name}`);
  if(fields.get('due')!==original.due)changes.push(`交期 ${original.due} → ${fields.get('due')}`);
  updated.owner=newOwner;updated.allocations=[{person:newOwner,role:'主责'}];
  document.querySelectorAll('[data-support]:checked').forEach(input=>{if(input.dataset.support!==newOwner)updated.allocations.push({person:input.dataset.support,role:'协同'});});
  updated.name=name;updated.deliverable=deliverable;updated.board=String(fields.get('board'));updated.due=String(fields.get('due'));updated.docLink=doc;
  const q=String(fields.get('quadrant'));updated.important=['Q1','Q2'].includes(q);updated.urgent=['Q1','Q3'].includes(q);updated.key=fields.get('key')==='on';
  if(changes.length)log(updated,changes.join('；'));
 }
 if(status!==original.status)log(updated,`状态 ${original.status} → ${status}`);
 if(result!==original.resultLink)log(updated,`成果已更新 ${result || '（空）'}`);
 if(note)log(updated,note);
 if(JSON.stringify(updated.milestones)!==JSON.stringify(original.milestones))log(updated,`节点进度 ${progress(updated)}%`);
 if(await commit('任务已更新',draft=>{draft.tasks=draft.tasks.map(t=>t.id===updated.id?updated:t);}))closeDialog(true);
}

function showConflict(next,label,latest) {
 const retainedDialog={kind:ui.dialog,title:$('#dialogTitle').textContent,body:$('#dialogBody').innerHTML,foot:$('#dialogFoot').innerHTML};
 // Capture input values rather than replacing a task draft silently.
 ui.conflict={next:clone(next),label,latest,retainedDialog};
 const rows=[];
 const taskFields={name:'任务名称',owner:'主责编号',board:'业务',due:'交期',assignedAt:'交办日期',closedAt:'关闭日期',archived:'归档',status:'状态',deliverable:'验收交付物',resultLink:'成果',docLink:'任务依据',important:'重要',urgent:'紧急',key:'重点任务'};
 for(const task of next.tasks) {
  const recent=latest.data.tasks.find(t=>t.id===task.id);
  if(!recent){rows.push([task.name,'新增任务','最新版本中无此任务',task.name]);continue;}
  for(const [field,label] of Object.entries(taskFields)) {
   if(String(task[field])!==String(recent[field]))rows.push([task.name,label,recent[field],task[field]]);
  }
  const allocations=t=>t.allocations.map(a=>person(a.person).name).join('、');
  if(allocations(task)!==allocations(recent))rows.push([task.name,'人员投入',allocations(recent),allocations(task)]);
  const milestones=t=>t.milestones.map(m=>`${m.name} ${m.done?'已完成':'未完成'}`).join('；');
  if(milestones(task)!==milestones(recent))rows.push([task.name,'节点',milestones(recent),milestones(task)]);
  const feedback=t=>t.history.at(-1)?.text || '';
  if(feedback(task)!==feedback(recent))rows.push([task.name,'最近反馈',feedback(recent),feedback(task)]);
 }
 for(const task of latest.data.tasks){if(!next.tasks.some(t=>t.id===task.id))rows.push([task.name,'任务范围','最新版本中存在','本次草稿未包含']);}
 for(const [key,label] of [['people','人员设置'],['notices','公告'],['requests','需求池'],['settings','文档设置']]) {
  if(JSON.stringify(next[key])!==JSON.stringify(latest.data[key]))rows.push([label,'内容',JSON.stringify(latest.data[key]),JSON.stringify(next[key])]);
 }
 $('#dialogTitle').textContent='检测到其他成员的修改';
 $('#dialogBody').innerHTML=`<p class="note warning">当前填写已保留，两个版本尚未合并。可以先导出本次草稿，再读取最新数据。</p><table class="diff"><thead><tr><th>任务 / 字段</th><th>最新版本</th><th>本次草稿</th></tr></thead><tbody>${rows.slice(0,30).map(([name,field,recent,draft])=>`<tr><td>${escapeHTML(name)}<br><small>${field}</small></td><td>${escapeHTML(recent ?? '')}</td><td>${escapeHTML(draft ?? '')}</td></tr>`).join('')}</tbody></table>${rows.length>30?'<p class="muted-block">显示前 30 项差异，其余内容可导出草稿核对。</p>':''}`;
 $('#dialogFoot').innerHTML='<button data-act="conflict-export">导出本次草稿</button><button class="primary" data-act="conflict-latest">读取最新版本</button>';
 ui.dialog='conflict';if(!$('#dialog').open)$('#dialog').showModal();document.body.style.overflow='hidden';setSaveState('检测到并发修改，待核对',true);
}

async function apiFetch(path,body,token=''){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
  const res=await fetch(API_URL+path,{method:body===undefined?'GET':'POST',headers:{apikey:API_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:controller.signal});
  const value=await res.json().catch(()=>({}));
  if(!res.ok)throw Object.assign(Error(value.msg||value.error_description||value.message||value.error||`请求失败 ${res.status}`),{code:value.code,status:res.status});
  return value;
 }finally{clearTimeout(timer);}
}
function rememberSession(value){authSession={...value,expires_at:value.expires_at||Math.floor(Date.now()/1000)+Number(value.expires_in||3600)};sessionStorage.setItem(SESSION_KEY,JSON.stringify(authSession));}
async function accessToken(){
 if(!authSession)throw Error('请先登录');
 if(authSession.expires_at>Date.now()/1000+40)return authSession.access_token;
 if(!refreshingToken)refreshingToken=apiFetch('/auth/v1/token?grant_type=refresh_token',{refresh_token:authSession.refresh_token}).then(value=>{rememberSession(value);return value.access_token;}).finally(()=>{refreshingToken=null;});
 return await refreshingToken;
}

async function archiveTask(id){
 const t=data.tasks.find(t=>t.id===id);if(!t||!canEdit(t)||t.status!=='已完成')return;
 if(ui.dirty)return formError('请先保存当前修改，再归档');
 if(await commit(t.archived?'任务已移出归档':'任务已归档',draft=>{const task=draft.tasks.find(t=>t.id===id);task.archived=!task.archived;log(task,task.archived?'归档':'取消归档');})){if(ui.dialog)closeDialog(true);render();}
}

document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.authMode){authMode=button.dataset.authMode;showAuth();return;}
 if(button.dataset.archiveTask){archiveTask(button.dataset.archiveTask);return;}
 if(button.dataset.enable){approveAccount(button.dataset.enable,true);return;}
 if(button.dataset.disable){approveAccount(button.dataset.disable,false);return;}
 if(button.dataset.page){prefs.page=Math.max(0,prefs.page+Number(button.dataset.page));render();return;}

 if(button.dataset.view)return navigate(button.dataset.view);
 if(button.dataset.act)return handleAction(button.dataset.act,button);
 if(button.dataset.task)return openTask(button.dataset.task);
 if(button.dataset.newOwner)return taskForm(button.dataset.newOwner);
 if(button.dataset.quick){prefs.quick=button.dataset.quick;render();return;}
 if(button.dataset.tab){prefs.taskTab=button.dataset.tab;render();return;}
 if(button.dataset.collapse){const id=button.dataset.collapse;prefs.collapsed=prefs.collapsed.includes(id)?prefs.collapsed.filter(x=>x!==id):[...prefs.collapsed,id];render();return;}
 if(button.dataset.copy){const id=button.dataset.copy;if(ui.dirty)return formError('请先保存当前修改，再复制任务');closeDialog(true);taskForm('',id);return;}
 if(button.dataset.notice)return noticeForm(button.dataset.notice);
 if(button.dataset.archive&&isManager())return commit('公告已归档',draft=>{draft.notices.find(n=>n.id===button.dataset.archive).archived=true;});
 if(button.dataset.assign&&isManager())return taskForm('','',button.dataset.assign);
 if(button.dataset.dismiss&&isManager())return commit('需求已标记为不立项',draft=>{draft.requests.find(r=>r.id===button.dataset.dismiss).status='不立项';});
 if(button.dataset.backup&&isManager()){const backup=envelope.backups.find(b=>b.id===button.dataset.backup);if(backup)previewImport(backup.data,'自动备份恢复预览');return;}
 if(button.dataset.transition)return saveTask(button.dataset.transition);
});
document.addEventListener('input',event=>{
 if(event.target.id==='search'){prefs.search=event.target.value;prefs.page=0;render();}
 if(['knowledgeLink','tableLink'].includes(event.target.id))ui.pageDirty=true;
 if(event.target.closest('#editForm')){if(event.target.dataset.milestone===undefined)ui.dirty=true;if(ui.dialog==='batch'){$('#batchPreview').innerHTML='';$('#dialogFoot').innerHTML='<button data-act="close">取消</button><button class="primary" data-act="preview-batch">预览变更</button>';}}
});
document.addEventListener('change',async event=>{
 const input=event.target;
 if(input.dataset.milestone!==undefined){if(ui.milestoneWrite)await ui.milestoneWrite;ui.milestoneWrite=saveMilestones();await ui.milestoneWrite;ui.milestoneWrite=null;return;}
 const filterKeys={boardFilter:'board',statusFilter:'status',sortFilter:'sort'};
 if(filterKeys[input.id]){prefs[filterKeys[input.id]]=input.value;prefs.page=0;render();return;}
 if(input.dataset.select){if(input.checked)ui.selected.add(input.dataset.select);else ui.selected.delete(input.dataset.select);render();return;}
 if(input.id==='importFile'){readImport(input.files[0]);return;}
 if(input.id==='template') {
  const template=TEMPLATES[input.value];if(template){for(const key of ['name','board','deliverable','milestones'])$('#editForm').elements.namedItem(key).value=template[key];ui.dirty=true;}return;
 }

});
document.addEventListener('submit',async event=>{
 if(event.target.id==='authForm'){event.preventDefault();await authSubmit(event.target);return;}
 if(event.target.id==='nameForm'){event.preventDefault();try{await resolveProfile(String(new FormData(event.target).get('name')));}catch(error){$('#authMessage').textContent=error.message;}return;}
 if(event.target.id==='claimForm'){event.preventDefault();try{profile=await rpc('ec_board_claim_admin',{p_token:String(new FormData(event.target).get('code')).trim()});await resolveProfile();}catch(error){$('#authMessage').textContent=error.message;}return;}
 if(event.target.id==='editForm'){event.preventDefault();if(ui.dialog==='new')saveNewTask();if(ui.dialog==='task')saveTask();if(ui.dialog==='notice')saveNotice();if(ui.dialog==='request')saveRequest();}});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();if(ui.dialog!=='conflict')closeDialog();});
document.addEventListener('keydown',event=>{
 if(profile?.status!=='active')return;
 const typing=/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable;
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'&&ui.dialog){event.preventDefault();if(ui.dialog==='task')saveTask();if(ui.dialog==='new')saveNewTask();return;}
 if(typing||ui.dialog||event.ctrlKey||event.metaKey||event.altKey)return;
 if(event.key==='/'){event.preventDefault();if(!$('#search'))navigate('overview');$('#search')?.focus();}
 if(event.key.toLowerCase()==='n'&&isManager()){event.preventDefault();taskForm();}
});
document.addEventListener('toggle',event=>{if(event.target.id==='archivePanel'){prefs.archiveOpen=event.target.open;remember();}},true);
setInterval(()=>{if(!document.hidden)refreshShared();},20000);
window.addEventListener('beforeunload',event=>{if(ui.dirty||ui.pending||ui.pageDirty){event.preventDefault();event.returnValue='';}});
initAuth();
if(envelope.savedAt)setSaveState(`云端已保存 · ${new Date(envelope.savedAt).toLocaleTimeString('zh-CN',{hour12:false})}`);
</script>
</body>
</html>
