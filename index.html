<body>
<aside class="sidebar">
 <div class="brand"><strong>环控团队工作看板</strong><small>V1.5 · 团队协作</small></div>
 <button class="nav" data-view="overview">团队工作总览</button>

 <div class="identity"><label for="role">演示身份</label><select id="role"><option value="supervisor">主管</option><option value="member">成员</option></select><label for="actor">当前成员</label><select id="actor"></select><small>本机保存 · 角色切换用于演示</small></div>
</aside>
<main class="main">
 <header class="topbar"><div><strong id="crumb">团队工作总览</strong><div id="saveState" class="save-state" role="status">本浏览器保存</div></div><div class="top-actions"><button id="undoButton" data-act="undo" title="撤销最近一次数据修改">撤销</button><button data-view="admin" id="adminButton">管理与备份</button><button data-act="request">提交需求</button><button class="primary" data-act="new" id="newButton">＋ 交办任务</button></div></header>
 <div class="content"><div id="banner"></div><div id="page"></div></div>
</main>

<div class="toast hidden" id="toast" role="status"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
// The public build substitutes only the roster and product name. No credentials are embedded.
const ROSTER = ['王立恒','刘军卫','尹冉','王素景','周小文','菅锦锦','郭丽丽','王晶','任云丰','杨恒旭','包容磊','李鑫','李国华','丁雪琳'];
const PUBLIC_EDITION = true;
const STORAGE = 'ec_team_board_v15';
const PREFS = 'ec_team_board_v15_prefs';
const LEGACY_KEYS = ['ec_team_board_pages_demo_v1','ec_team_board_demo_v1'];
const BOARDS = ['IPD','LTC','ITR','TPD','能力建设'];
const STATUSES = ['未开始','进行中','阻塞','待验收','已完成'];
const QUADRANTS = {Q1:'重要且紧急',Q2:'重要不紧急',Q3:'紧急不重要',Q4:'不重要不紧急'};
const VIEW_NAMES = {overview:'团队工作总览',quadrant:'团队工作四象限',tasks:'重点任务交办',meeting:'周例会视图',admin:'管理与备份'};
const TEMPLATES = {
 review:{name:'设计评审',board:'IPD',deliverable:'评审纪要及问题关闭清单',milestones:'准备评审资料\n组织评审\n关闭评审问题'},
 test:{name:'试验验证',board:'TPD',deliverable:'试验报告、数据记录及验证结论',milestones:'确认试验方案\n完成试验\n审核验证结论'},
 quality:{name:'问题闭环',board:'ITR',deliverable:'原因分析、整改措施及验证记录',milestones:'定位问题\n落实整改\n验证关闭'},
 delivery:{name:'资料交付',board:'LTC',deliverable:'完整交付资料及接收记录',milestones:'确认资料清单\n完成资料\n确认接收'}
};
const $ = selector => document.querySelector(selector);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = value => JSON.parse(JSON.stringify(value));
const uid = prefix => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const localDate = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const today = () => localDate(new Date());
function shiftDate(offset, from = today()) { const d = new Date(`${from}T12:00:00`); d.setDate(d.getDate()+offset); return localDate(d); }
function weekRange() { const d = new Date(); d.setDate(d.getDate()-(d.getDay()+6)%7); const begin = localDate(d); return [begin,shiftDate(6,begin)]; }
const dateOK = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(new Date(`${value}T12:00:00`).getTime()) && localDate(new Date(`${value}T12:00:00`)) === value;
const formatNumber = value => Number(value || 0).toLocaleString('zh-CN',{maximumFractionDigits:1});
const timestamp = () => new Date().toISOString();
const shortDate = value => value ? String(value).slice(5,10).replace('-','/') : '待定';
function initialData() {
 return {people:ROSTER.map((name,i)=>({id:String.fromCharCode(65+i),name,role:'待设置',capacity:32,feishuOpenId:''})),tasks:[],notices:[],requests:[],settings:{teamDocUrl:'',baseUrl:'',apiBase:''}};
}
function normalizeData(input) {
 const value = input?.schema === 2 ? input.data : input;
 if (!value || !Array.isArray(value.people) || !value.people.length || !Array.isArray(value.tasks)) throw Error('需要包含人员与任务的看板 JSON 文件');
 const data = clone(value);
 const ids = new Set();
 data.people = data.people.map(p=>{
  const id = String(p.id || '');
  if (!id || ids.has(id) || !String(p.name || '').trim() || !Number.isFinite(Number(p.capacity)) || Number(p.capacity)<0 || Number(p.capacity)>168) throw Error('人员编号、姓名或可分配工时无效');
  ids.add(id);
  return {...p,id,name:String(p.name),capacity:Number(p.capacity),role:String(p.role || '待设置')};
 });
 const taskIDs = new Set();
 data.tasks = data.tasks.map(t=>{
  if (!t.id || taskIDs.has(String(t.id)) || !String(t.name || '').trim() || !ids.has(String(t.owner)) || !STATUSES.includes(t.status) || !BOARDS.includes(t.board) || !dateOK(t.due)) throw Error(`任务 ${t.id || ''} 的编号、主责、状态、业务或交期无效`);
  taskIDs.add(String(t.id));
  if (!Array.isArray(t.allocations) || !Array.isArray(t.milestones)) throw Error(`任务 ${t.id} 缺少投入或节点`);
  const assigned = new Set();
  t.allocations = t.allocations.map(a=>{
   if (!ids.has(String(a.person)) || assigned.has(String(a.person)) || !Number.isFinite(Number(a.hours)) || Number(a.hours)<0 || Number(a.hours)>80) throw Error(`任务 ${t.id} 的投入人员或工时无效`);
   assigned.add(String(a.person));
   return {person:String(a.person),hours:Number(a.hours),role:String(a.person)===String(t.owner)?'主责':'协同'};

function transferOwner(task,newOwner,hours) {
 const previous=task.owner;
 task.allocations=task.allocations.filter(a=>a.person!==previous&&a.person!==newOwner);
 task.allocations.unshift({person:newOwner,role:'主责',hours:Number(hours)});task.owner=newOwner;
}
async function saveTask(nextStatus) {
 if(ui.milestoneWrite)await ui.milestoneWrite;
 if(ui.dialog!=='task')return;
 const original=data.tasks.find(t=>t.id===ui.taskID);if(!original||!canEdit(original)||!formValid())return;
 if(!isManager()&&nextStatus==='已完成')return formError('任务关闭由主管验收');
 if(!isManager()&&['待验收','已完成'].includes(original.status)&&nextStatus==='进行中')return formError('退回和重新开启由主管操作');
 const result=original.status==='已完成'?original.resultLink:String(formValue('resultLink') || '').trim(),note=String(formValue('note') || '').trim();
 const status=nextStatus || original.status;
 if(status==='待验收'&&!result)return formError('提交验收前请填写成果链接或编号');
 if(status==='阻塞'&&!note)return formError('请填写阻塞原因及所需支持');
 if(original.status==='待验收'&&status==='进行中'&&!note)return formError('请填写退回意见');
 if(status==='已完成'&&original.status!=='待验收')return formError('请先提交验收，再关闭任务');
 if(/^https?:/i.test(result)&&!validLink(result))return formError('成果链接需使用有效的 HTTPS 地址');
 const updated=clone(original);
 updated.resultLink=result;updated.status=status;
 updated.milestones.forEach((m,i)=>{m.done=status==='已完成'||Boolean(document.querySelector(`[data-milestone="${i}"]`)?.checked);});
 if(isManager()) {
  const fields=new FormData($('#editForm'));
  const name=String(fields.get('name')).trim(),deliverable=String(fields.get('deliverable')).trim(),doc=String(fields.get('docLink')).trim();
  if(!name||!deliverable)return formError('任务名称与交付物不能为空');
  if(!validLink(doc))return formError('任务依据需填写有效 HTTPS 链接');
  const newOwner=String(fields.get('owner')),hours=Number(fields.get('hours'));
  const changes=[];
  if(newOwner!==original.owner)changes.push(`主责 ${person(original.owner).name} → ${person(newOwner).name}`);
  if(fields.get('due')!==original.due)changes.push(`交期 ${original.due} → ${fields.get('due')}`);
  if(hours!==original.allocations.find(a=>a.person===original.owner)?.hours)changes.push(`主责投入调整为 ${hours} h`);
  transferOwner(updated,newOwner,hours);
  updated.allocations=[updated.allocations[0]];
  document.querySelectorAll('[data-support]').forEach(input=>{if(input.dataset.support!==newOwner&&Number(input.value)>0)updated.allocations.push({person:input.dataset.support,role:'协同',hours:Number(input.value)});});
  updated.name=name;updated.deliverable=deliverable;updated.board=String(fields.get('board'));updated.due=String(fields.get('due'));updated.docLink=doc;
  const q=String(fields.get('quadrant'));updated.important=['Q1','Q2'].includes(q);updated.urgent=['Q1','Q3'].includes(q);updated.key=fields.get('key')==='on';
  if(changes.length)log(updated,changes.join('；'));
 }
 if(status!==original.status)log(updated,`状态 ${original.status} → ${status}`);
 if(result!==original.resultLink)log(updated,`成果已更新 ${result || '（空）'}`);
 if(note)log(updated,note);
 if(JSON.stringify(updated.milestones)!==JSON.stringify(original.milestones))log(updated,`节点进度 ${progress(updated)}%`);
 if(await commit('任务已更新',draft=>{draft.tasks=draft.tasks.map(t=>t.id===updated.id?updated:t);}))closeDialog(true);
}
async function saveMilestones() {
 const task=data.tasks.find(t=>t.id===ui.taskID);
 if(!task||!canEdit(task)||!isActive(task))return;
 const checks=[...document.querySelectorAll('[data-milestone]')].map(input=>input.checked);
 const previousToken=ui.editToken;
 if(await commit('节点进度已保存',draft=>{
  const changed=draft.tasks.find(t=>t.id===task.id);
  changed.milestones.forEach((m,i)=>{m.done=Boolean(checks[i]);});
  log(changed,`节点进度 ${progress(changed)}%`);
 })) {
  if(ui.dialog==='task'&&ui.taskID===task.id&&ui.editToken===previousToken){ui.editToken=envelope.token;$('#dialogSubtitle').textContent=`${task.id} · ${person(task.owner).name} · 节点已保存 ${progress(data.tasks.find(t=>t.id===task.id))}%`;}
 }
}

 if(!isManager())return;
 const notice=data.notices.find(n=>n.id===id);
 ui.noticeID=id;
 showDialog('notice',id?'编辑公告':'发布公告',`<form id="editForm"><label class="field">公告标题 *<input name="title" required autofocus maxlength="120" value="${escapeHTML(notice?.title || '')}"></label><label class="field">公告正文 *<textarea name="content" required rows="6" maxlength="3000">${escapeHTML(notice?.content || '')}</textarea></label><div class="form-grid"><label class="field">有效期，可留空<input name="expiry" type="date" value="${notice?.expiry || ''}"></label><label class="field">发布人<input name="author" value="${escapeHTML(notice?.author || person(prefs.actor).name)}" maxlength="60"></label></div><label class="field"><span><input type="checkbox" name="pinned" ${notice?.pinned?'checked':''}> 首页置顶</span></label></form>`,'<button data-act="close">取消</button><button class="primary" data-act="save-notice">保存公告</button>');
}
async function saveNotice() {
 if(!isManager()||!formValid())return;
 const fields=new FormData($('#editForm')),title=String(fields.get('title')).trim(),content=String(fields.get('content')).trim();
 if(!title||!content)return formError('标题与正文不能为空');
 const notice={id:ui.noticeID || uid('N'),title,content,author:String(fields.get('author')).trim(),expiry:String(fields.get('expiry')),pinned:fields.get('pinned')==='on',archived:false,createdAt:data.notices.find(n=>n.id===ui.noticeID)?.createdAt || timestamp()};
 if(await commit('公告已保存',draft=>{draft.notices=draft.notices.filter(n=>n.id!==notice.id);draft.notices.unshift(notice);}))closeDialog(true);
}
function requestForm() {
 showDialog('request','提交需求',`<form id="editForm"><label class="field">需求名称 *<input name="name" autofocus required maxlength="120"></label><div class="form-grid"><label class="field">业务板块<select name="board">${options(BOARDS,prefs.lastBoard)}</select></label><label class="field">期望交期，可留空<input name="due" type="date"></label></div><label class="field">背景与要求<textarea name="note" rows="4" maxlength="1500"></textarea></label></form>`,'<button data-act="close">取消</button><button class="primary" data-act="save-request">加入需求池</button>','主管分派后计入任务与负荷');
}
async function saveRequest() {
 if(!formValid())return;
 const fields=new FormData($('#editForm')),name=String(fields.get('name')).trim();if(!name)return formError('请填写需求名称');
 const request={id:uid('REQ'),name,board:String(fields.get('board')),due:String(fields.get('due')),note:String(fields.get('note')).trim(),source:person(prefs.actor).name,status:'待分派',createdAt:timestamp()};
 if(await commit('需求已提交',draft=>draft.requests.unshift(request))){closeDialog(true);navigate('tasks');}
}
function batchForm() {
 if(!isManager()||!ui.selected.size)return;
 showDialog('batch','批量调整',`<form id="editForm"><p class="note">将调整 ${ui.selected.size} 项任务。完成填写后先预览变更。</p><label class="field">统一主责，可留空<select name="owner">${peopleOptions('','保持各任务主责')}</select></label><label class="field">统一交期，可留空<input name="due" type="date"></label><label class="field">统一业务板块<select name="board"><option value="">保持原业务</option>${options(BOARDS,'')}</select></label></form><div id="batchPreview"></div>`,'<button data-act="close">取消</button><button class="primary" data-act="preview-batch">预览变更</button>');
}
function previewBatch() {
 if(!isManager()||!formValid())return;
 const owner=formValue('owner'),due=formValue('due'),board=formValue('board');
 if(!owner&&!due&&!board)return formError('至少选择一项变更');
 ui.batchChanges={owner,due,board,ids:[...ui.selected]};
 const tasks=data.tasks.filter(t=>ui.selected.has(t.id));
 $('#batchPreview').innerHTML=`<table class="diff"><thead><tr><th>任务</th><th>变更前</th><th>变更后</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${escapeHTML(t.name)}</td><td>${escapeHTML(person(t.owner).name)} / ${t.due} / ${t.board}</td><td>${escapeHTML(person(owner || t.owner).name)} / ${due || t.due} / ${board || t.board}</td></tr>`).join('')}</tbody></table><p class="note">转派后保留原主责工时，新主责原协同记录归并为主责，请检查调整后的人员负荷。</p>`;
 $('#dialogFoot').innerHTML='<button data-act="close">取消</button><button class="primary" data-act="apply-batch">确认批量保存</button>';
}
async function applyBatch() {
 if(!isManager()||!ui.batchChanges)return;
 const changes=ui.batchChanges;
 if(await commit('批量调整已保存',draft=>{draft.tasks.filter(t=>changes.ids.includes(t.id)).forEach(t=>{const notes=[];if(changes.owner&&changes.owner!==t.owner){notes.push(`主责 ${person(t.owner).name} → ${person(changes.owner).name}`);transferOwner(t,changes.owner,t.allocations.find(a=>a.person===t.owner)?.hours || 0);}if(changes.due){notes.push(`交期 ${t.due} → ${changes.due}`);t.due=changes.due;}if(changes.board){notes.push(`业务 ${t.board} → ${changes.board}`);t.board=changes.board;}log(t,`批量调整 ${notes.join('；')}`);});})){ui.selected.clear();closeDialog(true);render();}
}
function download(name,content,type) {const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON() {download(`环控看板_完整备份_${today()}.json`,JSON.stringify({schema:2,data,revision:envelope.revision,token:envelope.token,exportedAt:timestamp()},null,2),'application/json;charset=utf-8');}
function exportCSV() {
 const rows=[['任务编号','任务名称','业务板块','主责','协同','计划交期','状态','四象限','本周总计划工时','验收交付物','实际成果'],...filteredTasks().map(t=>[t.id,t.name,t.board,person(t.owner).name,t.allocations.filter(a=>a.role==='协同').map(a=>`${person(a.person).name} ${a.hours}h`).join('、'),t.due,t.status,quadrant(t),t.allocations.reduce((s,a)=>s+a.hours,0),t.deliverable,t.resultLink])];
 const cell=v=>{let value=String(v ?? '');if(/^[=+@\-\t\r]/.test(value))value="'"+value;return '"'+value.replace(/"/g,'""')+'"';};
 download(`环控看板_任务台账_${today()}.csv`,'\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}
function previewImport(candidate,label) {
 if(!isManager())return;
 try {ui.importData=normalizeData(candidate);}catch(error){showToast(`无法导入：${error.message}`);return;}
 const incoming=ui.importData;
 const keys=[['人员','people'],['任务','tasks'],['公告','notices'],['需求','requests']];
 showDialog('import',label,`<p class="note warning">恢复会替换当前看板数据。当前版本将在保存前自动备份。</p><table class="diff"><thead><tr><th>内容</th><th>当前</th><th>恢复后</th></tr></thead><tbody>${keys.map(([name,key])=>`<tr><td>${name}</td><td>${data[key].length}</td><td>${incoming[key].length}</td></tr>`).join('')}</tbody></table><p class="muted-block">恢复后人员：${incoming.people.map(p=>escapeHTML(p.name)).join('、')}</p>`,'<button data-act="close">取消</button><button class="primary" data-act="apply-import">确认恢复</button>');
}
function showConflict(next,label,latest) {
 const retainedDialog={kind:ui.dialog,title:$('#dialogTitle').textContent,body:$('#dialogBody').innerHTML,foot:$('#dialogFoot').innerHTML};
 // Capture input values rather than replacing a task draft silently.
 ui.conflict={next:clone(next),label,latest,retainedDialog};
 const rows=[];
 const taskFields={name:'任务名称',owner:'主责编号',board:'业务',due:'交期',status:'状态',deliverable:'验收交付物',resultLink:'成果',docLink:'任务依据',important:'重要',urgent:'紧急',key:'重点任务'};
 for(const task of next.tasks) {
  const recent=latest.data.tasks.find(t=>t.id===task.id);
  if(!recent){rows.push([task.name,'新增任务','最新版本中无此任务',task.name]);continue;}
  for(const [field,label] of Object.entries(taskFields)) {
   if(String(task[field])!==String(recent[field]))rows.push([task.name,label,recent[field],task[field]]);
  }
  const allocations=t=>t.allocations.map(a=>`${person(a.person).name} ${a.hours} h`).join('；');
  if(allocations(task)!==allocations(recent))rows.push([task.name,'人员投入',allocations(recent),allocations(task)]);
  const milestones=t=>t.milestones.map(m=>`${m.name} ${m.done?'已完成':'未完成'}`).join('；');
  if(milestones(task)!==milestones(recent))rows.push([task.name,'节点',milestones(recent),milestones(task)]);
  const feedback=t=>t.history.at(-1)?.text || '';
  if(feedback(task)!==feedback(recent))rows.push([task.name,'最近反馈',feedback(recent),feedback(task)]);
 }
 for(const task of latest.data.tasks){if(!next.tasks.some(t=>t.id===task.id))rows.push([task.name,'任务范围','最新版本中存在','本次草稿未包含']);}
 for(const [key,label] of [['people','人员设置'],['notices','公告'],['requests','需求池'],['settings','文档设置']]) {
  if(JSON.stringify(next[key])!==JSON.stringify(latest.data[key]))rows.push([label,'内容',JSON.stringify(latest.data[key]),JSON.stringify(next[key])]);
 }
 $('#dialogTitle').textContent='检测到另一标签页的修改';
 $('#dialogBody').innerHTML=`<p class="note warning">当前填写已保留，两个版本尚未合并。可以先导出本次草稿，再读取最新数据。</p><table class="diff"><thead><tr><th>任务 / 字段</th><th>最新版本</th><th>本次草稿</th></tr></thead><tbody>${rows.slice(0,30).map(([name,field,recent,draft])=>`<tr><td>${escapeHTML(name)}<br><small>${field}</small></td><td>${escapeHTML(recent ?? '')}</td><td>${escapeHTML(draft ?? '')}</td></tr>`).join('')}</tbody></table>${rows.length>30?'<p class="muted-block">显示前 30 项差异，其余内容可导出草稿核对。</p>':''}`;
 $('#dialogFoot').innerHTML='<button data-act="conflict-export">导出本次草稿</button><button class="primary" data-act="conflict-latest">读取最新版本</button>';
 ui.dialog='conflict';if(!$('#dialog').open)$('#dialog').showModal();document.body.style.overflow='hidden';setSaveState('检测到并发修改，待核对',true);
}
async function applyInline(input) {
 if(!isManager())return;
 const next=clone(data);let label='';
 try {
  if(input.dataset.hours){const t=next.tasks.find(t=>t.id===input.dataset.hours);const a=t.allocations.find(a=>a.person===input.dataset.person);const value=Number(input.value);if(!input.value||!Number.isFinite(value)||value<0||value>80)throw Error('任务工时需在 0–80 小时之间');if(a.hours===value)return;a.hours=value;log(t,`${person(a.person).name}投入调整为 ${value} h`);label='计划工时已更新';}
  if(input.dataset.due){if(!dateOK(input.value))throw Error('请填写有效交期');const t=next.tasks.find(t=>t.id===input.dataset.due);if(t.due===input.value)return;log(t,`交期 ${t.due} → ${input.value}`);t.due=input.value;label='交期已调整';}
  if(input.dataset.priority){const t=next.tasks.find(t=>t.id===input.dataset.priority);const q=input.value;if(!QUADRANTS[q])throw Error('优先级无效');t.important=['Q1','Q2'].includes(q);t.urgent=['Q1','Q3'].includes(q);log(t,`优先级调整为 ${q} ${QUADRANTS[q]}`);label='优先级已更新';}
  if(input.dataset.capacity){const p=next.people.find(p=>p.id===input.dataset.capacity);const value=Number(input.value);if(!input.value||!Number.isFinite(value)||value<0||value>168)throw Error('周可分配工时需在 0–168 小时之间');p.capacity=value;label='可分配工时已更新';}
  if(input.dataset.roleEdit){const p=next.people.find(p=>p.id===input.dataset.roleEdit);p.role=input.value.trim() || '待设置';label='业务分工已更新';}
  if(label)await publishLocal(next,label);
 }catch(error){showToast(error.message);render();}
}
function printMeeting() {if(prefs.view!=='meeting')navigate('meeting');window.print();}
async function readImport(file) {if(!isManager()||!file)return;try{const value=JSON.parse(await file.text());previewImport(value,'导入备份预览');}catch(error){showToast(`无法读取备份：${error.message}`);}$('#importFile').value='';}
async function handleAction(action,button) {
 switch(action) {
  case 'new':taskForm();break;
  case 'close':if(ui.dialog==='conflict')return showToast('请先导出草稿或读取最新版本');closeDialog();break;
  case 'discard':closeDialog(true);break;
  case 'save-new':saveNewTask();break;
  case 'save-task':saveTask();break;
  case 'notice':noticeForm();break;
  case 'save-notice':saveNotice();break;
  case 'request':requestForm();break;
  case 'save-request':saveRequest();break;
  case 'undo':if(ui.dialog)return showToast('请先保存或关闭当前详情');await undo();break;
  case 'clear-filter':Object.assign(prefs,{search:'',board:'all',status:'all',quick:'all'});render();break;
  case 'expand':prefs.collapsed=[];render();break;
  case 'collapse':prefs.collapsed=data.people.map(p=>p.id);render();break;
  case 'select-clear':ui.selected.clear();render();break;
  case 'select-visible':filteredTasks().forEach(t=>ui.selected.add(t.id));render();break;
  case 'batch':batchForm();break;
  case 'preview-batch':previewBatch();break;
  case 'apply-batch':applyBatch();break;
  case 'export-json':if(isManager())exportJSON();break;
  case 'export-csv':exportCSV();break;
  case 'import':if(isManager())$('#importFile').click();break;
  case 'apply-import':if(isManager()&&ui.importData&&await publishLocal(ui.importData,'备份已恢复',ui.editToken)){if(!data.people.some(p=>p.id===prefs.actor))prefs.actor=data.people[0].id;ui.selected.clear();closeDialog(true);render();}break;
  case 'reset-view':Object.assign(prefs,{search:'',board:'all',status:'all',quick:'all',sort:'order',collapsed:[],taskTab:'all'});ui.scroll={};render();showToast('已恢复默认视图');break;
  case 'print':printMeeting();break;
  case 'save-links':{
   if(!isManager())break;
   const team=$('#knowledgeLink').value.trim(),table=$('#tableLink').value.trim();
   if(!validLink(team)||!validLink(table))return showToast('请使用有效的 HTTPS 链接');
   if(await commit('文档链接已保存',draft=>{draft.settings.teamDocUrl=team;draft.settings.baseUrl=table;}))ui.pageDirty=false;break;
  }
  case 'retry':{const p=ui.pending;if(p&&await publishLocal(p.next,p.label,p.baseToken,p.undoStack)){if(ui.dialog&&ui.dialog!=='conflict')closeDialog(true);}break;}
  case 'reload-data':if(ui.dialog)return showToast('请先保存当前草稿，系统会自动核对版本');try{const latest=readLatest();if(latest){envelope=latest;data=latest.data;ui.storageChanged=false;render();showToast('已读取最新数据');}}catch(error){showToast(error.message);}break;
  case 'conflict-export':download(`环控看板_未合并草稿_${today()}.json`,JSON.stringify({schema:2,data:ui.conflict.next},null,2),'application/json;charset=utf-8');break;
  case 'conflict-latest':try{const latest=readLatest();if(latest){envelope=latest;data=latest.data;}ui.storageChanged=false;ui.pending=null;ui.saveError='';ui.conflict=null;closeDialog(true);render();setSaveState('已读取最新版本');showToast('已读取最新数据，可重新应用草稿中的修改');}catch(error){showToast(error.message);}break;
 }
}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.view)return navigate(button.dataset.view);
 if(button.dataset.act)return handleAction(button.dataset.act,button);
 if(button.dataset.task)return openTask(button.dataset.task);
 if(button.dataset.newOwner)return taskForm(button.dataset.newOwner);
 if(button.dataset.quick){prefs.quick=button.dataset.quick;render();return;}
 if(button.dataset.tab){prefs.taskTab=button.dataset.tab;render();return;}
 if(button.dataset.collapse){const id=button.dataset.collapse;prefs.collapsed=prefs.collapsed.includes(id)?prefs.collapsed.filter(x=>x!==id):[...prefs.collapsed,id];render();return;}
 if(button.dataset.copy){const id=button.dataset.copy;if(ui.dirty)return formError('请先保存当前修改，再复制任务');closeDialog(true);taskForm('',id);return;}
 if(button.dataset.notice)return noticeForm(button.dataset.notice);
 if(button.dataset.archive&&isManager())return commit('公告已归档',draft=>{draft.notices.find(n=>n.id===button.dataset.archive).archived=true;});
 if(button.dataset.assign&&isManager())return taskForm('','',button.dataset.assign);
 if(button.dataset.dismiss&&isManager())return commit('需求已标记为不立项',draft=>{draft.requests.find(r=>r.id===button.dataset.dismiss).status='不立项';});
 if(button.dataset.backup&&isManager()){const backup=envelope.backups.find(b=>b.id===button.dataset.backup);if(backup)previewImport(backup.data,'自动备份恢复预览');return;}
 if(button.dataset.transition)return saveTask(button.dataset.transition);
});
document.addEventListener('input',event=>{
 if(event.target.id==='search'){prefs.search=event.target.value;render();}
 if(['knowledgeLink','tableLink'].includes(event.target.id))ui.pageDirty=true;
 if(event.target.closest('#editForm')){if(event.target.dataset.milestone===undefined)ui.dirty=true;if(ui.dialog==='new')refreshLoadPreview();if(ui.dialog==='batch'){$('#batchPreview').innerHTML='';$('#dialogFoot').innerHTML='<button data-act="close">取消</button><button class="primary" data-act="preview-batch">预览变更</button>';}}
});
document.addEventListener('change',async event=>{
 const input=event.target;
 if(input.dataset.milestone!==undefined){if(ui.milestoneWrite)await ui.milestoneWrite;ui.milestoneWrite=saveMilestones();await ui.milestoneWrite;ui.milestoneWrite=null;return;}
 if(input.id==='role'){prefs.role=input.value;if(prefs.role!=='supervisor'&&prefs.view==='admin')prefs.view='overview';ui.selected.clear();render();return;}
 if(input.id==='actor'){prefs.actor=input.value;render();return;}
 const filterKeys={boardFilter:'board',statusFilter:'status',sortFilter:'sort'};
 if(filterKeys[input.id]){prefs[filterKeys[input.id]]=input.value;render();return;}
 if(input.dataset.select){if(input.checked)ui.selected.add(input.dataset.select);else ui.selected.delete(input.dataset.select);render();return;}
 if(input.id==='importFile'){readImport(input.files[0]);return;}
 if(input.id==='template') {
  const template=TEMPLATES[input.value];if(template){for(const key of ['name','board','deliverable','milestones'])$('#editForm').elements.namedItem(key).value=template[key];ui.dirty=true;}return;
 }
 if(input.dataset.hours||input.dataset.due||input.dataset.priority||input.dataset.capacity||input.dataset.roleEdit)applyInline(input);
});
document.addEventListener('submit',event=>{if(event.target.id==='editForm'){event.preventDefault();if(ui.dialog==='new')saveNewTask();if(ui.dialog==='task')saveTask();if(ui.dialog==='notice')saveNotice();if(ui.dialog==='request')saveRequest();}});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();if(ui.dialog!=='conflict')closeDialog();});
document.addEventListener('keydown',event=>{
 const typing=/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable;
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'&&ui.dialog){event.preventDefault();if(ui.dialog==='task')saveTask();if(ui.dialog==='new')saveNewTask();return;}
 if(typing||ui.dialog||event.ctrlKey||event.metaKey||event.altKey)return;
 if(event.key==='/'){event.preventDefault();if(!$('#search'))navigate('overview');$('#search')?.focus();}
 if(event.key.toLowerCase()==='n'&&isManager()){event.preventDefault();taskForm();}
});
window.addEventListener('storage',event=>{
 if(event.key!==STORAGE||!event.newValue)return;
 try {const latest=parseSaved(event.newValue);if(latest.token===envelope.token)return;ui.storageChanged=true;if(!ui.dialog&&!ui.pending&&!ui.pageDirty){envelope=latest;data=latest.data;ui.storageChanged=false;render();showToast('已同步另一标签页的修改');}else renderBanner();}catch(error){ui.saveError=`另一标签页数据无效：${error.message}`;renderBanner();}
});
window.addEventListener('beforeunload',event=>{if(ui.dirty||ui.pending||ui.pageDirty){event.preventDefault();event.returnValue='';}});
render();
if(envelope.savedAt)setSaveState(`本浏览器已保存 · ${new Date(envelope.savedAt).toLocaleTimeString('zh-CN',{hour12:false})}`);
</script>
</body>
</html>
