<script>
'use strict';
const STORAGE='ec_team_board_pages_demo_v1';
const FEISHU_BACKEND_ENABLED = false;
function canUseFeishuBackend() {
  return FEISHU_BACKEND_ENABLED && location.protocol === 'https:';
}
const boards=['IPD','LTC','ITR','TPD','能力建设'];
const pnames={Q1:'重要且紧急',Q2:'重要不紧急',Q3:'紧急不重要',Q4:'不重要不紧急'};
const boardDescriptions={IPD:'产品开发 · 设计评审 · 产品验证',LTC:'客户需求 · 技术配置 · 交付支撑',ITR:'质量问题 · 现场改进 · 问题闭环',TPD:'技术预研 · 平台开发 · 试验验证','能力建设':'标准专利 · 工具开发 · 人才培养'};
const views={overview:'团队工作总览',quadrant:'团队工作四象限',watch:'重点任务交办',admin:'主管管理后台'};
const state={view:'overview',search:'',board:'全部板块',status:'全部状态',sort:'load',expanded:new Set(),editing:null,role:'supervisor',memberId:'A',adminTab:'roles',apiStatus:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateShift=(offset)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return iso(d)};
const shortDate=s=>s?String(s).slice(5).replace('-','/'):'—';
const startMonday=()=>{let d=new Date();d.setHours(12,0,0,0);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d};
const start=startMonday();const weekEnd=new Date(start);weekEnd.setDate(start.getDate()+6);
const weekText=`${pad(start.getMonth()+1)}.${pad(start.getDate())} — ${pad(weekEnd.getMonth()+1)}.${pad(weekEnd.getDate())}`;
const uid=()=>`TASK-${Math.floor(Date.now()%100000000)}-${Math.floor(Math.random()*900+100)}`;
const basePeople=[
{id:'A',name:'成员A',role:'系统设计 / 技术牵头',capacity:32},
{id:'B',name:'成员B',role:'IPD产品开发',capacity:32},
{id:'C',name:'成员C',role:'LTC环境配置',capacity:30},
{id:'D',name:'成员D',role:'ITR质量与可靠性',capacity:32},
{id:'E',name:'成员E',role:'TPD平台研发',capacity:32},
{id:'F',name:'成员F',role:'标准、知识与工具',capacity:30},
{id:'G',name:'成员G',role:'业务交付与数据支撑',capacity:28}
];
function makeTask(id,name,board,owner,hours,due,quadrant,key=false,status='进行中',completed=1,deliverable='',support=null){
 const names=board==='ITR'?['问题定位','整改措施','验证关闭']:board==='能力建设'?['方案规划','成果开发','归档发布']:['需求确认','方案与执行','评审验收'];
 const ms=names.map((n,i)=>({name:n,done:i<completed}));
 return {id,name,board,owner,allocations:[{person:owner,hours,role:'主责'},...(support?[{person:support.person,hours:support.hours,role:'协同'}]:[])],due:dateShift(due),important:['Q1','Q2'].includes(quadrant),urgent:['Q1','Q3'].includes(quadrant),key,status,deliverable:deliverable||'技术方案/工作结果及验收记录',description:'',milestones:ms,updatedAt:new Date().toISOString(),history:[{date:new Date().toISOString(),text:'演示任务初始化'}]};
}
const seededTasks=[
makeTask('T-001','通用模块样件验证','TPD','A',17,12,'Q2',true,'进行中',1,'样件验证方案、试验报告'),
makeTask('T-002','设备接口设计评审','IPD','A',10,3,'Q1',true,'进行中',2,'接口评审清单与问题关闭记录'),
makeTask('T-003','高温工况算例复核','IPD','A',7,7,'Q2',false,'进行中',1),
makeTask('T-004','设计计算模板标准化','能力建设','A',4,18,'Q2',false,'未开始',0),
makeTask('T-005','设备维护空间校核','IPD','B',15,10,'Q2',true,'进行中',1),
makeTask('T-006','设计评审问题闭环','IPD','B',10,4,'Q1',true,'待验收',3),
makeTask('T-007','通用组件接口核对','IPD','B',6,14,'Q2',false,'进行中',1),
makeTask('T-008','新场景配置需求评估','LTC','C',10,2,'Q1',true,'进行中',2),
makeTask('T-009','高湿场景配置演练','LTC','C',9,9,'Q2',false,'进行中',1),
makeTask('T-010','多尘场景防护方案复核','LTC','C',7,15,'Q2',false,'未开始',0),
makeTask('T-011','选型工具需求梳理','能力建设','C',3,20,'Q2',false,'未开始',0),
makeTask('T-012','样机密封异常分析','ITR','D',14,1,'Q1',true,'阻塞',1,'根因分析与整改方案',{person:'G',hours:3}),
makeTask('T-013','试验设备异常复盘','ITR','D',12,5,'Q1',true,'进行中',1),
makeTask('T-014','质量问题复发案例梳理','ITR','D',6,20,'Q2',false,'进行中',1),
makeTask('T-015','环境模型算例校核','TPD','E',14,11,'Q2',true,'进行中',1),
makeTask('T-016','高湿场景试验验证','TPD','E',12,8,'Q2',true,'进行中',2),
makeTask('T-017','试验记录字段核对','TPD','E',8,17,'Q2',false,'进行中',1),
makeTask('T-018','团队知识库及标准索引','能力建设','F',10,14,'Q2',true,'进行中',1),
makeTask('T-019','新方法技术说明整理','能力建设','F',8,18,'Q2',true,'进行中',1),
makeTask('T-020','新成员学习路线图','能力建设','F',4,22,'Q2',false,'未开始',0),
makeTask('T-021','高低温试验示例数据整理','LTC','G',10,6,'Q3',false,'进行中',1),
makeTask('T-022','典型问题经验分享','能力建设','G',5,19,'Q2',false,'未开始',0),
makeTask('T-023','客户技术资料示例整理','LTC','G',8,2,'Q3',false,'进行中',1)
];
let db;
try{let stored=JSON.parse(localStorage.getItem(STORAGE));db=stored&&Array.isArray(stored.people)&&Array.isArray(stored.tasks)?stored:null}catch(e){}
if(!db)db={people:structuredClone(basePeople),tasks:structuredClone(seededTasks)};
const seedNotices=[
{id:'N-001',title:'本周任务分配要求：优先保障重点交付',category:'工作要求',content:'新增紧急任务时，主管同步确认原有任务是否延期或转派；任务必须有唯一主责、交期和验收交付物。',author:'团队主管',pinned:true,expiry:'',createdAt:new Date().toISOString()},
{id:'N-002',title:'重大问题与跨部门阻塞及时升级',category:'业务提醒',content:'影响关键交付的风险应主动上报；阻塞原因、所需支持及计划解除时间要明确，避免仅登记“持续跟踪”。',author:'团队主管',pinned:true,expiry:'',createdAt:new Date().toISOString()},
{id:'N-003',title:'能力建设时间请提前在周计划中预留',category:'能力建设',content:'标准、CBB、技术文档和知识库建设纳入正式任务计划，不应长期被临时事务挤占。',author:'团队主管',pinned:false,expiry:'',createdAt:new Date().toISOString()}
];
if(!db.settings)db.settings={teamDocUrl:'',baseUrl:'',gatewayUrl:''};
if(!Array.isArray(db.notices))db.notices=structuredClone(seedNotices);
const seedRequests=[
{id:'REQ-001',name:'通用设备过滤配置快速复核',board:'LTC',source:'项目经理',note:'需明确交付时间和主责人员',due:dateShift(9),status:'待分派',createdAt:new Date().toISOString()},
{id:'REQ-002',name:'设备维护案例复盘',board:'能力建设',source:'团队成员',note:'拟输出案例与检查表',due:'',status:'待分派',createdAt:new Date().toISOString()}
];
if(!Array.isArray(db.requests))db.requests=structuredClone(seedRequests);
if(state.noticeExpanded===undefined)state.noticeExpanded=false;
if(state.watchTab===undefined)state.watchTab='open';

function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch(e){toast('浏览器无法保存本地数据；刷新后可能丢失')}}
function person(pid){return db.people.find(p=>p.id===pid)||{id:pid,name:'未知成员',role:'',capacity:32}}
function quadrant(t){return t.important?(t.urgent?'Q1':'Q2'):(t.urgent?'Q3':'Q4')}
function done(t){return t.status==='已完成'}
function active(t){return !done(t)}
function hoursFor(p){return db.tasks.filter(active).reduce((n,t)=>n+(t.allocations||[]).filter(a=>a.person===p.id).reduce((s,a)=>s+Number(a.hours||0),0),0)}
function countFor(p){return db.tasks.filter(t=>active(t)&&(t.owner===p.id||(t.allocations||[]).some(a=>a.person===p.id))).length}
function pct(t){const m=t.milestones||[];return m.length?Math.round(m.filter(x=>x.done).length/m.length*100):(done(t)?100:0)}
function warning(t){return active(t)&&Boolean(t.due)&&t.due<iso(new Date())}
function dueText(t){
  if(!t.due)return '待定';
  const urgency=warning(t)?'逾期':active(t)&&t.due<=dateShift(3)?'临期':'';
  return urgency
    ? `<span class="${urgency==='逾期'?'date-red':'date-soon'}">${esc(shortDate(t.due))} · ${urgency}</span>`
    : esc(shortDate(t.due));
}
function statusChip(status){const cls={'已完成':'green','进行中':'info','待验收':'info','阻塞':'red','未开始':'gray'}[status]||'gray';return `<span class="chip ${cls}">${esc(status)}</span>`}
function qChip(t){let q=quadrant(t);return `<span class="chip ${q==='Q1'?'red':q==='Q2'?'info':q==='Q3'?'orange':'neutral'}">${q}</span>`}
function boardChip(b){return `<span class="business ${b==='能力建设'?'build':''}">${esc(b)}</span>`}
function calc(){const a=db.tasks.filter(active),avail=db.people.reduce((s,p)=>s+Number(p.capacity||0),0),used=db.people.reduce((s,p)=>s+hoursFor(p),0);return {open:a.length,people:db.people.length,used,avail,over:db.people.filter(p=>hoursFor(p)>p.capacity).length,blocked:a.filter(t=>t.status==='阻塞').length,overdue:a.filter(warning).length,key:a.filter(t=>t.key).length}}
function kpisHTML(){const c=calc();return `<div class="kpis"><div class="kpi"><div class="kpi-label">团队成员</div><div class="kpi-value">${c.people}<small style="font-size:13px"> 人</small></div><div class="kpi-foot">团队在册</div></div><div class="kpi"><div class="kpi-label">在办任务</div><div class="kpi-value">${c.open}<small style="font-size:13px"> 项</small></div><div class="kpi-foot">五大业务统一统计</div></div><div class="kpi"><div class="kpi-label">本周计划投入</div><div class="kpi-value">${fmt(c.used)}<small style="font-size:13px"> h</small></div><div class="kpi-foot">可用 ${fmt(c.avail)} h · 不等于实际工时</div></div><div class="kpi ${c.over?'alert':''}"><div class="kpi-label">超负荷成员</div><div class="kpi-value">${c.over}<small style="font-size:13px"> 人</small></div><div class="kpi-foot">计划投入超过可分配时间</div></div><div class="kpi ${(c.blocked||c.overdue)?'alert':''}"><div class="kpi-label">阻塞 / 已逾期</div><div class="kpi-value">${c.blocked}<small style="font-size:13px"> / ${c.overdue}</small></div><div class="kpi-foot">在办任务按状态和交期统计</div></div></div>`}
function fmt(n){return Number(n).toFixed(1).replace(/\.0$/,'')}
function buildPage(){
 const descriptions={
   overview:'按成员查看在办任务、交付状态和本周计划工时。',
   quadrant:'按重要性和紧急性查看团队在办任务。',
   watch:'跟踪重点任务从接收到验收的进度。',
   admin:'管理人员映射、飞书文档、数据和提醒接口。'
 };
 const title=views[state.view]||views.overview;
 const pages={overview:overviewPage,quadrant:quadrantPage,watch:watchPage,admin:adminPage};
 $('#page').innerHTML=`<header class="pagehead"><div><h1>${title}</h1><p>${descriptions[state.view]||descriptions.overview}</p></div></header>${(pages[state.view]||overviewPage)()}`;
 $('#crumbTitle').textContent=title;
 $('#sidebarWatchCount').textContent=String(db.tasks.filter(t=>t.key&&active(t)).length);
 document.querySelectorAll('[data-nav]').forEach(n=>{
   const selected=n.dataset.nav===state.view;
   n.classList.toggle('active',selected);
   if(n.classList.contains('nav'))n.setAttribute('aria-current',selected?'page':'false');
 });
 if(state.view==='overview')renderWorkforceCards();
}
function memberTasksSection(){return `<section id="memberTasks" class="member-section"><div class="section-title"><h2>团队任务与人员负荷</h2><span>计划工时计入主责与协同投入</span></div><div class="filters"><input id="taskSearch" class="field search" aria-label="搜索成员、任务或编号" placeholder="搜索成员 / 工作内容 / 任务编号" value="${esc(state.search)}"><select id="businessFilter" aria-label="筛选业务板块" class="field"><option value="全部板块">全部业务板块</option>${boards.map(b=>`<option value="${b}" ${state.board===b?'selected':''}>${b}</option>`).join('')}</select><select id="statusFilter" aria-label="筛选任务状态" class="field"><option value="全部状态">全部状态</option>${['未开始','进行中','待验收','阻塞','已完成'].map(x=>`<option value="${x}" ${state.status===x?'selected':''}>${x}</option>`).join('')}</select><select id="sortFilter" aria-label="成员列表排序" class="field"><option value="load" ${state.sort==='load'?'selected':''}>按负荷排序</option><option value="name" ${state.sort==='name'?'selected':''}>按人员排序</option><option value="task" ${state.sort==='task'?'selected':''}>按任务数量</option></select><button class="btn sm" data-action="expand-all">展开</button><button class="btn sm" data-action="collapse-all">折叠</button></div><div class="section-title" style="margin-top:6px"><h3>成员任务列表 <span id="workforceCount"></span></h3><span>点击任务查看详情</span></div><div id="workforceCards" class="work-grid"></div></section>`}
function renderWorkforceCards(){const wrap=$('#workforceCards');if(!wrap)return;let ps=[...db.people];if(state.sort==='load')ps.sort((a,b)=>hoursFor(b)/b.capacity-hoursFor(a)/a.capacity);if(state.sort==='name')ps.sort((a,b)=>a.id.localeCompare(b.id));if(state.sort==='task')ps.sort((a,b)=>countFor(b)-countFor(a));const cards=[];let shown=0;for(const p of ps){let tasks=db.tasks.filter(t=>t.owner===p.id||(t.allocations||[]).some(a=>a.person===p.id)).filter(t=>state.board==='全部板块'||t.board===state.board).filter(t=>state.status==='全部状态'||t.status===state.status).filter(t=>!state.search||[p.name,p.role,t.id,t.name,t.board,t.deliverable].join(' ').toLowerCase().includes(state.search.toLowerCase()));if(!tasks.length)continue;shown+=tasks.length;tasks.sort((a,b)=>Number(b.key)-Number(a.key)||a.due.localeCompare(b.due));let h=hoursFor(p),ratio=p.capacity?h/p.capacity*100:0,over=ratio>100,low=ratio<70,collapsed=state.expanded.has(p.id)?false:state.expanded.has('!'+p.id);const rows=tasks.map(t=>{const assign=(t.allocations||[]).find(a=>a.person===p.id)||{person:p.id,role:t.owner===p.id?'主责':'协同',hours:0};const d=dueText(t);return `<div class="task-row" tabindex="0" role="button" data-open="${esc(t.id)}" aria-label="查看 ${esc(t.name)} 任务详情"><div><div class="task-title">${esc(t.name)}</div><div class="task-sub">${boardChip(t.board)}${qChip(t)}${t.key?'<span class="p-key">重点交办</span>':''}${assign.role==='协同'?'<span class="round-label">协同任务</span>':''}</div></div><div class="small-cell">${esc(assign.role)} · ${fmt(assign.hours)} h</div><div class="st-progress"><div class="tinybar"><i style="width:${pct(t)}%"></i></div><span>${pct(t)}%</span></div><div class="small-cell">${d}</div><div>${statusChip(t.status)}</div><div class="small-cell" style="color:#246bb7;font-weight:650">查看详情</div></div>`}).join('');cards.push(`<div class="person ${over?'over':''} ${collapsed?'collapsed':''}" data-person="${esc(p.id)}"><div class="person-head" data-toggle="${esc(p.id)}" role="button" tabindex="0" aria-expanded="${!collapsed}"><div class="person-info"><div class="avatar">${esc(p.id)}</div><div><div class="person-name">${esc(p.name)}</div><div class="person-role">${esc(p.role)}</div></div></div><div class="person-meta"><div class="person-detail"><strong>${countFor(p)}</strong> 项在办</div><div class="person-detail"><strong>${db.tasks.filter(t=>t.key&&active(t)&&(t.owner===p.id||(t.allocations||[]).some(a=>a.person===p.id))).length}</strong> 项重点</div><div class="load"><div class="load-label"><span>本周计划负荷</span><b>${fmt(h)} / ${fmt(p.capacity)} h · ${Math.round(ratio)}%</b></div><div class="bar"><i class="${over?'over':ratio>=90?'high':''}" style="width:${Math.min(ratio,100)}%"></i></div></div><span class="chip ${over?'red':low?'neutral':'green'}">${over?'超负荷':low?'有余量':'合理区间'}</span><div class="chevron">⌄</div></div></div><div class="person-tasks"><div class="tasks-header"><div>工作内容 / 业务归属 / 优先级</div><div>本周本人投入</div><div>节点进度</div><div>交付日期</div><div>任务状态</div><div>操作</div></div>${rows}</div></div>`)}$('#workforceCount').textContent=`（${cards.length} 人 / ${shown} 条匹配任务）`;wrap.innerHTML=cards.length?cards.join(''):'<div class="panel empty">没有匹配的成员或任务。请清除筛选条件。</div>'}

function announcementSection(){
 let now=iso(new Date()),all=db.notices.filter(n=>!n.archived&&(!n.expiry||n.expiry>=now)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.createdAt.localeCompare(a.createdAt));
 const visible=state.noticeExpanded?all:all.slice(0,2);
 return `<section class="panel announce-card"><div class="panel-head"><div class="announcement-head"><h3>团队业务公告</h3><span class="chip info">领导要求 / 日常通知</span></div><div class="tracking-toolbar"><button class="btn sm supervisor-only" data-action="notice-new">＋ 发布公告</button>${all.length>2?`<button class="btn sm" data-action="notice-toggle">${state.noticeExpanded?'收起':'全部 '+all.length+' 条'}</button>`:''}</div></div><div class="announce-list">${visible.length?visible.map(n=>`<div class="announce-item"><div><div class="announce-title">${n.pinned?'<span class="announce-badge priority-pin">置顶</span>':''}<span class="announce-badge">${esc(n.category)}</span>${esc(n.title)}</div><div class="announce-text">${esc(n.content)}</div><div class="announce-meta">${esc(n.author||'团队主管')} · ${esc((n.createdAt||'').slice(0,10))} ${n.expiry?' · 有效至 '+esc(n.expiry):''}</div></div><div class="announce-controls"><button class="btn sm ghost supervisor-only" data-action="notice-edit" data-notice-id="${esc(n.id)}">编辑</button><button class="btn sm ghost danger supervisor-only" data-action="notice-archive" data-notice-id="${esc(n.id)}">归档</button>${hasGateway()?`<button class="btn sm supervisor-only" data-action="notice-remind" data-notice-id="${esc(n.id)}">发送飞书</button>`:''}</div></div>`).join(''):'<div class="announce-empty">暂无有效公告。可点击“发布公告”添加团队工作要求。</div>'}</div></section>`
}
function businessStrip(){const counts=boards.map(b=>{let ts=db.tasks.filter(t=>active(t)&&t.board===b);let h=ts.reduce((s,t)=>s+(t.allocations||[]).reduce((v,a)=>v+Number(a.hours||0),0),0);return {b,n:ts.length,h}}),max=Math.max(1,...counts.map(x=>x.h));return `<div class="business-strip">${counts.map(x=>`<div class="business-mini"><header><span>${esc(x.b)}</span><strong>${fmt(x.h)}<small style="font-size:10px;font-weight:500"> h</small></strong></header><div class="bar"><i style="width:${x.h/max*100}%"></i></div><footer>${x.n} 项在办 · 计划投入</footer></div>`).join('')}</div>`}
const watchTabs=[['open','全部在办'],['unstarted','待接收'],['in-progress','进行中'],['blocked','阻塞'],['review','待验收'],['done','已关闭']];
function watchFiltered(){
 const statuses={unstarted:'未开始','in-progress':'进行中',blocked:'阻塞',review:'待验收',done:'已完成'};
 const status=statuses[state.watchTab];
 return db.tasks
   .filter(t=>t.key&&(status?t.status===status:active(t)))
   .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
}
function stateStages(t){let stages=[['未开始','待接收'],['进行中','执行中'],['待验收','待验收'],['已完成','已关闭']];let cur=t.status==='阻塞'?1:stages.findIndex(x=>x[0]===t.status);return `<div class="task-stage">${stages.map((x,i)=>`${i?'<span class="stage-arrow">›</span>':''}<span class="stage-chip ${i<cur?'done-stage':i===cur?'current':''}">${x[1]}</span>`).join('')}${t.status==='阻塞'?'<span class="chip red">当前阻塞</span>':''}</div>`}
function showNoticeDrawer(id){const n=id?db.notices.find(n=>n.id===id):null;state.editNotice=id||null;openDrawer(`<div class="drawer-top"><div><div class="eyebrow">TEAM ANNOUNCEMENT</div><h2>${n?'编辑团队业务公告':'发布团队业务公告'}</h2><p>发布领导工作要求、团队业务通知和统一执行口径。</p></div><button class="close" data-action="close">×</button></div><div class="drawer-content"><form id="noticeForm"><div class="form-group"><label>公告标题 *</label><input class="field" name="title" required maxlength="90" value="${esc(n?.title||'')}" placeholder="例如：本周技术评审统一要求"></div><div class="form-grid"><div class="form-group"><label>公告类别</label><select class="field" name="category">${['工作要求','业务提醒','会议安排','能力建设','其他'].map(v=>`<option ${n?.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-group"><label>发布人</label><input class="field" name="author" maxlength="30" value="${esc(n?.author||'团队主管')}"></div></div><div class="form-group"><label>公告正文 *</label><textarea class="field" name="content" rows="5" maxlength="800" required placeholder="只写执行要求、适用范围和关键时间节点。">${esc(n?.content||'')}</textarea></div><div class="form-grid"><div class="form-group"><label>有效期（可选）</label><input class="field" name="expiry" type="date" value="${esc(n?.expiry||'')}"></div><div class="form-group"><label>是否置顶</label><select class="field" name="pinned"><option value="true" ${n?.pinned!==false?'selected':''}>置顶</option><option value="false" ${n?.pinned===false?'selected':''}>普通</option></select></div></div></form><div class="note-tip">演示中公告保存在当前浏览器；接入飞书后可由管理员发布，并将公告表设为只读公开。</div></div><div class="drawer-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="notice-save">${n?'保存公告':'发布公告'}</button></div>`)}
function saveNotice(){const f=$('#noticeForm');if(!f.reportValidity())return;const fd=new FormData(f);let title=String(fd.get('title')).trim(),content=String(fd.get('content')).trim();if(!title||!content)return toast('请填写标题和正文');let n=state.editNotice?db.notices.find(n=>n.id===state.editNotice):null;if(!n){n={id:'N-'+Date.now(),createdAt:new Date().toISOString()};db.notices.unshift(n)}Object.assign(n,{title,content,category:String(fd.get('category')),author:String(fd.get('author')).trim()||'团队主管',expiry:String(fd.get('expiry')||''),pinned:fd.get('pinned')==='true',archived:false});persist();closeDrawer();buildPage();toast('公告已保存（当前浏览器）')}
function showRequestDrawer(){openDrawer(`<div class="drawer-top"><div><div class="eyebrow">TASK INTAKE</div><h2>提交工作需求</h2><p>需求先入池，由主管统一评估优先级和人员负荷后交办。</p></div><button class="close" data-action="close">×</button></div><div class="drawer-content"><form id="requestForm"><div class="form-group"><label>需求名称 *</label><input name="name" required maxlength="110" class="field" placeholder="例如：完成某项目环境配置审核"></div><div class="form-grid"><div class="form-group"><label>所属板块</label><select name="board" class="field">${boards.map(b=>`<option>${b}</option>`).join('')}</select></div><div class="form-group"><label>需求来源</label><input name="source" class="field" placeholder="例如：项目经理" maxlength="40"></div></div><div class="form-group"><label>期望完成时间（可选）</label><input name="due" class="field" type="date"></div><div class="form-group"><label>背景与要求（可选）</label><textarea name="note" class="field" maxlength="500" rows="3" placeholder="简要描述目的、关键约束、预期输出。"></textarea></div></form><div class="note-tip">需求池不计入员工个人负荷；主管正式分派、明确本周投入后才纳入统计。</div></div><div class="drawer-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="request-save">加入需求池</button></div>`)}
function saveRequest(){const f=$('#requestForm');if(!f.reportValidity())return;let fd=new FormData(f),name=String(fd.get('name')).trim();if(!name)return toast('请填写需求名称');db.requests.unshift({id:'REQ-'+Date.now(),name,board:String(fd.get('board')),source:String(fd.get('source')||'业务需求'),note:String(fd.get('note')||''),due:String(fd.get('due')||''),status:'待分派',createdAt:new Date().toISOString()});persist();closeDrawer();state.view='watch';buildPage();toast('需求已进入待分派池')}

function overviewPage(){
 return `${kpisHTML()}${memberTasksSection()}
 <section class="overview-section">
   <div class="section-title"><h2>业务投入</h2><span>本周在办任务计划工时</span></div>
   ${businessStrip()}
 </section>
 <div class="overview-section">${announcementSection()}</div>`;
}

function quadrantPage(){
 const quads=[['Q1','red'],['Q2','blue'],['Q3','orange'],['Q4','gray']];
 return `<div class="quad-grid">${quads.map(([q,color])=>{
  const tasks=db.tasks.filter(t=>active(t)&&quadrant(t)===q)
    .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
  return `<section class="quad ${color}">
   <div class="quad-head"><h2>${q} · ${pnames[q]}</h2><span class="chip neutral">${tasks.length} 项</span></div>
   ${tasks.length?tasks.map(t=>`<button type="button" class="quad-task" data-open="${esc(t.id)}">
    <strong>${esc(t.name)}</strong>
    <span class="foot"><span>${esc(person(t.owner).name)} · ${dueText(t)}</span>${statusChip(t.status)}</span>
   </button>`).join(''):'<p class="empty">暂无在办任务</p>'}
  </section>`;
 }).join('')}</div>`;
}

function watchPage(){
 const requests=db.requests.filter(r=>r.status==='待分派');
 const tasks=watchFiltered();
 const nextSteps={'未开始':'等主责接收','进行中':'更新关键节点','阻塞':'协调阻塞','待验收':'主管验收','已完成':'已归档'};
 return `<section aria-label="重点任务台账">
  <div class="section-title assignment-heading"><h2>重点任务 <span>${tasks.length} 项</span></h2>
   <div class="tracking-toolbar" role="group" aria-label="筛选重点任务状态">${watchTabs.map(([key,label])=>`
    <button type="button" class="tab-pill ${state.watchTab===key?'active':''}" data-watch-tab="${key}" aria-pressed="${state.watchTab===key}">${label}</button>`).join('')}
   </div>
  </div>
  <div class="panel assignment-list">${tasks.length?tasks.map(t=>`<article class="assignment-row">
   <div class="assignment-task">
    <button type="button" class="task-link" data-open="${esc(t.id)}">${esc(t.name)}</button>
    <span class="minor">${esc(t.id)} · ${esc(t.board)} · ${quadrant(t)}</span>
   </div>
   <div><span class="assignment-label">验收交付物</span><span>${esc(t.deliverable||'待补充')}</span></div>
   <div><span class="assignment-label">主责 / 交期</span><span>${esc(person(t.owner).name)} · ${dueText(t)}</span></div>
   <div><span class="assignment-label">当前状态</span>${statusChip(t.status)}</div>
   <div><span class="assignment-label">下一步</span><span>${nextSteps[t.status]||'查看详情'}</span></div>
  </article>`).join(''):'<div class="empty">当前筛选条件下暂无任务</div>'}</div>
 </section>
 <section class="panel overview-section">
  <div class="panel-head"><h2>任务需求池 <small>${requests.length} 条待分派</small></h2><button class="btn sm" data-action="request-new">＋ 提交需求</button></div>
  ${requests.length?requests.map(r=>`<div class="request-row">
   <div><strong>${esc(r.name)}</strong><p>${esc(r.board)} · ${esc(r.source||'业务提出')}${r.due?' · 期望 '+esc(r.due):''} · ${esc(r.note||'等待主管确认')}</p></div>
   <div class="req-actions"><button class="btn sm primary supervisor-only" data-action="request-assign" data-request-id="${esc(r.id)}">分派</button><button class="btn sm ghost supervisor-only" data-action="request-dismiss" data-request-id="${esc(r.id)}">不立项</button></div>
  </div>`).join(''):'<div class="announce-empty">暂无待分派需求</div>'}

function saveTaskChanges(overrideStatus){
 let t=db.tasks.find(x=>x.id===state.editing);if(!t)return;
 const valid=['未开始','进行中','阻塞','待验收','已完成'];const status=overrideStatus||t.status;
 if(!valid.includes(status))return;
 let due=$('#editDue').value,hours=Number($('#editHours').value),q=$('#editQuadrant').value,note=$('#editNote').value.trim(),result=$('#editResult').value.trim();
 if(!due||!Number.isFinite(hours)||hours<0||hours>80){toast('请检查交期和计划投入，本周未安排投入可填0；已安排任务为0.5–80小时');return}
 if(status==='阻塞'&&!note){toast('上报阻塞时请简要说明原因及需要的支持');return}
 if(status==='待验收'&&!result){toast('提交验收前请填写成果链接、报告编号或附件名称');return}
 if(overrideStatus==='已完成' && t.status!=='待验收'){toast('任务需先提交验收才能关闭');return}
 if(overrideStatus==='进行中' && t.status==='待验收'&&!note){toast('退回修改时，请写明验收意见');return}
 const prev=t.status;t.status=status;t.due=due;t.important=['Q1','Q2'].includes(q);t.urgent=['Q1','Q3'].includes(q);t.resultLink=result;
 const a=(t.allocations||[]).find(a=>a.person===t.owner);if(a)a.hours=hours;
 (t.milestones||[]).forEach((m,i)=>m.done=!!document.querySelector(`[data-milestone="${i}"]`)?.checked);
 if(status==='已完成')(t.milestones||[]).forEach(m=>m.done=true);
 if(status!==prev)t.history.push({date:new Date().toISOString(),text:`状态「${prev}」→「${status}」`});
 if(result&&result!==t.lastSubmittedResult)t.history.push({date:new Date().toISOString(),text:'成果已记录：'+result});t.lastSubmittedResult=result;
 if(note)t.history.push({date:new Date().toISOString(),text:note});t.updatedAt=new Date().toISOString();persist();closeDrawer();buildPage();
 toast(status==='待验收'?'已提交成果，等待主管验收':status==='已完成'?'已验收关闭':status==='阻塞'?'阻塞已上报':'节点或任务状态已保存')
}
function saveNewTask(){

 const docLink=String(data.get('docLink')||'').trim();if(docLink&&!validFeishuUrl(docLink))return toast('请填写有效飞书文档链接');

 const milestones=(enteredMilestones.length?enteredMilestones:['需求确认','方案执行','成果验收']).map(name=>({name,done:false}));
 const rid=String(data.get('requestId')||'');let t={id:uid(),name:String(data.get('name')).trim(),board:data.get('board'),owner,allocations:[{person:owner,hours,role:'主责'},...(support?[{person:support,hours:supportHours,role:'协同'}]:[])],due:String(data.get('due')),important:data.get('important')==='true',urgent:data.get('urgent')==='true',key:data.get('key')==='on',status:'未开始',deliverable:String(data.get('deliverable')).trim(),docLink:String(data.get('docLink')||'').trim(),resultLink:'',milestones,updatedAt:new Date().toISOString(),history:[{date:new Date().toISOString(),text:'主管正式交办（演示）'}]};
 db.tasks.unshift(t);if(rid){let r=db.requests.find(x=>x.id===rid);if(r){r.status='已分派';r.taskId=t.id}}
 persist();closeDrawer();state.view='watch';state.watchTab='unstarted';buildPage();toast(`已交办给 ${ownerP.name}，待员工确认接收（本地演示）`)
}

 return makeCSV(rows||[])

 openDrawer(`<div class="task-drawer"><div class="drawer-top"><div><div class="eyebrow">${esc(t.id)} · ${esc(t.board)} · ${t.key?'重点任务':'普通任务'}</div><h2>${esc(t.name)}</h2><p>${esc(owner.name)}负责 · ${esc(t.due)}交付</p></div><button class="close" data-action="close">×</button></div>

const _v12saveTaskChanges=saveTaskChanges;
saveTaskChanges=function(next){
 const t=db.tasks.find(x=>x.id===state.editing);if(!t||!canOperate(t))return toast('当前身份无权更新该任务');
 if(!canManage()&&['已完成'].includes(next))return toast('成员不能直接验收关闭');
 if(!canManage()&&next==='进行中'&&t.status==='待验收')return toast('成员不能退回验收');

 const due=$('#editDue'),hours=$('#editHours'),q=$('#editQuadrant');
 // Original function reads these controls; provide temporary hidden fields for member-only drawer
 const form=$('#drawer');let temps=[];
 for(const [id,value] of [['editDue',t.due],['editHours',String(t.allocations.find(a=>a.person===t.owner)?.hours||0)],['editQuadrant',quadrant(t)]]){
  if(!$('#'+id)){let v=document.createElement('input');v.type='hidden';v.id=id;v.value=value;form.appendChild(v);temps.push(v)}
 }
 if(canManage()){
  const doc=$('#editDoc')?.value.trim()||'';
  if(doc&&!validFeishuUrl(doc)){temps.forEach(x=>x.remove());return toast('任务依据必须为合法的飞书HTTPS文档链接')}
  t.docLink=doc;
 }
 const result=$('#editResult')?.value.trim()||'';
 if(/^https?:\/\//i.test(result)&&!validFeishuUrl(result)){temps.forEach(x=>x.remove());return toast('请使用合法飞书文档链接，或填写纯文本成果编号')}
 const was=t.status;_v12saveTaskChanges(next);temps.forEach(x=>x.remove());
 if((next==='阻塞'||next==='待验收')&&t.status===next&&was!==next)notifyFeishu(next==='阻塞'?'blocker':'review',t);
};

async function notifyFeishu(kind,item){
 if(!hasGateway()){toast('操作已保存在本地；飞书未连接，没有发送消息');return false}
 const isTask=kind!=='notice';
 const payload=isTask?{kind,taskId:item.id,personId:item.owner,title:item.name,board:item.board,due:item.due,docLink:item.docLink||'',resultLink:item.resultLink||'',status:item.status,deliverable:item.deliverable||'',detail:(item.history||[]).slice(-1)[0]?.text||''}:{kind:'notice',noticeId:item.id,title:item.title,content:item.content};
 try{const res=await fetch('/api/feishu/remind',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':state.csrf||''},credentials:'same-origin',body:JSON.stringify(payload)});let data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'服务端返回失败');toast('飞书消息已由服务端确认发送');return true}catch(e){toast('飞书消息未发送：'+String(e.message||e));return false}
}

 for(const t of db.tasks){
  out.tasks.push({'任务编号':t.id,'任务名称':t.name,'业务板块':t.board,'主责任人编号':t.owner,'主责任人':person(t.owner).name,'重要':t.important?'是':'否','紧急':t.urgent?'是':'否','四象限':quadrant(t),'重点督办':t.key?'是':'否','状态':t.status,'交付日期':t.due,'验收要求':t.deliverable||'','关联飞书文档':t.docLink||'','成果链接/编号':t.resultLink||'','更新时间':t.updatedAt||now(),'执行反馈':(t.history||[]).slice(-1)[0]?.text||''});
  (t.allocations||[]).forEach((a,i)=>out.allocations.push({'投入编号':t.id+'-'+(i+1),'任务编号':t.id,'人员编号':a.person,'姓名':person(a.person).name,'角色':a.role||'主责','计划周开始':iso(start),'本周计划小时':num(a.hours)}));
  (t.milestones||[]).forEach((m,i)=>out.milestones.push({'节点编号':t.id+'-M'+(i+1),'任务编号':t.id,'顺序':i+1,'节点名称':m.name,'完成状态':m.done?'已完成':'未完成'}));
  out.deliverables.push({'成果编号':t.id+'-D1','任务编号':t.id,'要求交付物':t.deliverable||'','实际成果':t.resultLink||'','任务状态':t.status,'验收完成':t.status==='已完成'?'是':'否'});
 }
 for(const n of db.notices)out.notices.push({'公告编号':n.id,'标题':n.title,'类别':n.category||'','内容':n.content||'','发布人':n.author||'','置顶':n.pinned?'是':'否','有效期':n.expiry||'','发布日期':n.createdAt||now(),'归档':n.archived?'是':'否'});
 for(const r of db.requests)out.requests.push({'需求编号':r.id,'需求名称':r.name,'业务归属':r.board,'提出来源':r.source||'','说明':r.note||'','期望交期':r.due||'','需求状态':r.status||'待分派','关联任务编号':r.taskId||''});
 return out;
}
function parseRemote(tables){
 const v=k=>(tables[k]||[]).map(r=>r.fields||{});
 const people=v('people').map(p=>({id:val(p['人员编号']),name:val(p['姓名']),role:val(p['业务方向']),capacity:num(p['本周可分配小时']),feishuOpenId:val(p['飞书open_id(演示)'])})).filter(p=>p.id);
 const tasks=v('tasks').map(t=>({
  id:val(t['任务编号']),name:val(t['任务名称']),board:val(t['业务板块'])||'IPD',owner:val(t['主责任人编号']),important:yes(t['重要']),urgent:yes(t['紧急']),key:yes(t['重点督办']),status:val(t['状态'])||'未开始',due:val(t['交付日期']).slice(0,10),deliverable:val(t['验收要求']),docLink:val(t['关联飞书文档']),resultLink:val(t['成果链接/编号']),updatedAt:val(t['更新时间']),description:'',history:[{date:val(t['更新时间'])||now(),text:val(t['执行反馈'])||'飞书任务读取'}],milestones:[],allocations:[]
 })).filter(t=>t.id);
 const byId=new Map(tasks.map(t=>[t.id,t]));
 const allAlloc=v('allocations'),current=iso(start);
 const weeks=new Map();for(const a of allAlloc){let k=val(a['任务编号']);if(!weeks.has(k))weeks.set(k,new Set());weeks.get(k).add(val(a['计划周开始']))}
 for(const a of allAlloc){const t=byId.get(val(a['任务编号']));if(!t)continue;const week=val(a['计划周开始']);if(week!==current)continue;t.allocations.push({person:val(a['人员编号']),role:val(a['角色']),hours:num(a['本周计划小时'])})}
 for(const m of v('milestones').sort((a,b)=>num(a['顺序'])-num(b['顺序']))){const t=byId.get(val(m['任务编号']));if(t)t.milestones.push({name:val(m['节点名称']),done:val(m['完成状态'])==='已完成'})}
 for(const d of v('deliverables')){const t=byId.get(val(d['任务编号']));if(t&&!t.resultLink)t.resultLink=val(d['实际成果'])}
 const notices=v('notices').map(n=>({id:val(n['公告编号']),title:val(n['标题']),category:val(n['类别']),content:val(n['内容']),author:val(n['发布人']),pinned:yes(n['置顶']),expiry:val(n['有效期']),createdAt:val(n['发布日期']),archived:yes(n['归档'])})).filter(n=>n.id);
 const requests=v('requests').map(r=>({id:val(r['需求编号']),name:val(r['需求名称']),board:val(r['业务归属']),source:val(r['提出来源']),note:val(r['说明']),due:val(r['期望交期']),status:val(r['需求状态']),taskId:val(r['关联任务编号'])})).filter(r=>r.id);
 return {people,tasks,notices,requests,settings:db.settings||{teamDocUrl:'',baseUrl:'',gatewayUrl:''}};
}
function remember(tables){baseline={};for(const key of TABLES){baseline[key]=new Map();for(const r of tables[key]||[]){const f=r.fields||{},id=val(f[KEYS[key]]);if(id)baseline[key].set(id,f)}}}
async function request(url,method='GET',body){
 if(!canUseFeishuBackend())throw Error('当前演示未启用飞书后端');
 const resp=await fetch(url,{method,credentials:'same-origin',cache:'no-store',headers:{...(body?{'Content-Type':'application/json','X-CSRF-Token':state.csrf||''}:{})},...(body?{body:JSON.stringify(body)}:{})});
 let json;try{json=await resp.json()}catch{throw Error(`接口未返回 JSON（HTTP ${resp.status}），请检查反向代理与后端服务`)}
 if(!resp.ok||json.ok===false)throw Error(json.error||json.message||`请求失败 ${resp.status}`);return json;
}
async function loadRemote(silent=false){
 if(location.protocol==='file:'){if(!silent)toast('本地HTML无法读飞书；请先部署后端并配置登录');return false}
 if(loading)return false;loading=true;
 try{
  const r=await request('/api/bitable/data');
  const remote=parseRemote(r.tables);
  remember(r.tables);db=remote;linked=true;failed=false;statusMessage='已连接·飞书数据';
  _basePersist();buildPage();if(!silent)toast('已从飞书读取七张数据表');return true;
 }catch(e){linked=false;statusMessage='未连接：'+e.message;if(!silent)toast(statusMessage);return false}
 finally{loading=false}
}
function changes(){
 const out=[],snapshot=modelRows();
 for(const table of TABLES)for(const f of snapshot[table]){
  const id=val(f[KEYS[table]]);if(!id)continue;const previous=baseline[table]?.get(id);
  const diff={};for(const [k,v] of Object.entries(f))if(previous===undefined||val(previous[k])!==val(v))diff[k]=v;
  if(previous!==undefined&&Object.keys(diff).length===0)continue;
  if(previous!==undefined)diff[KEYS[table]]=id;
  if(state.role!=='supervisor'){
    if(table==='requests'){if(previous)continue;}
    else if(table==='tasks'){
      if(!previous||val(f['主责任人编号'])!==state.memberId)continue;
      for(const k of Object.keys(diff))if(!['任务编号','状态','成果链接/编号','更新时间','执行反馈'].includes(k))delete diff[k];
    }else if(table==='milestones'){
      if(!previous||!db.tasks.some(t=>t.id===f['任务编号']&&t.owner===state.memberId))continue;
      for(const k of Object.keys(diff))if(!['节点编号','完成状态'].includes(k))delete diff[k];
    }else if(table==='deliverables'){
      if(!previous||!db.tasks.some(t=>t.id===f['任务编号']&&t.owner===state.memberId))continue;
      for(const k of Object.keys(diff))if(!['成果编号','实际成果'].includes(k))delete diff[k];
    }else continue;
  }
  if(Object.keys(diff).length>1||previous===undefined)out.push({table,id,fields:diff});
 }
 return out;
}
async function syncNow(silent=false){
 if(!linked||sending)return false;sending=true;failed=false;let count=0;
 try{
  for(let loop=0;loop<8;loop++){
   const ops=changes();if(!ops.length)break;
   if(ops.length>160)throw Error('待同步记录过多，已停止自动同步，请先刷新并联系管理员');
   for(const op of ops){await request('/api/bitable/upsert','POST',{table:op.table,fields:op.fields});
    baseline[op.table].set(op.id,{...(baseline[op.table]?.get(op.id)||{}),...op.fields});count++;
   }
  }
  statusMessage=`飞书已同步${count?' · '+count+'条':''}`;if(!silent)toast(statusMessage);return true;
 }catch(e){failed=true;statusMessage='同步失败：'+e.message;toast(statusMessage+'；本地修改待人工核对');return false}
 finally{sending=false}
}
const _basePersist=persist;
persist=function(){_basePersist();if(linked){void syncNow(true)}};
const _baseNotify=notifyFeishu;
notifyFeishu=async function(kind,item){if(linked){if(sending){for(let i=0;i<100&&sending;i++)await new Promise(r=>setTimeout(r,50))}if(failed){toast('数据同步失败，已停止消息通知，请先修复同步');return false}await syncNow(true);if(failed)return false}return _baseNotify(kind,item)};
const _baseImport=importJSON;
importJSON=function(file){if(linked)return toast('在线模式禁止直接导入本地 JSON，避免覆盖团队共享数据');return _baseImport(file)};
const _previousBuild=buildPage;
buildPage=function(){
  _previousBuild();
  if(linked){
    const mark=document.querySelector('.sample-mark');
    if(mark){mark.textContent='飞书多维表格 · 在线数据';mark.style.background='#e8f5f1';mark.style.color='#277266'}
  }
};
const _baseFeishu=feishuPage;
feishuPage=function(){
 if(!canUseFeishuBackend())return `<section class="admin-panel">
  <h3>飞书多维表格接口</h3>
  <p>网页演示使用浏览器本地数据。飞书登录、消息和七张表的同步需要企业 HTTPS 后端及服务端授权。</p>
 </section>
 <section class="admin-panel">
  <h3>本地数据备份与恢复</h3>
  <p>JSON 备份包含人员、任务、里程碑、公告、需求和文档设置。换电脑或浏览器时，可导出后再导入。</p>
  <div class="foot-actions">
   <button class="btn primary" data-action="export-all">导出 JSON 备份</button>
   <button class="btn" data-action="import-all">导入 JSON 备份</button>
   <button class="btn danger" data-action="reset-data">恢复初始示例</button>
  </div>
 </section>`;
 const cfg=state.bitableConfig||{appToken:'',tables:{}};
 const fields=TABS.map(([k,label])=>`<div class="form-group" style="min-width:0"><label>${label} · table_id</label><input class="field" data-bitable-table="${k}" value="${esc(cfg.tables?.[k]||'')}" placeholder="tblxxxxxxxx" spellcheck="false" autocomplete="off"/></div>`).join('');
 return `<section class="panel" style="padding:18px;margin-bottom:14px">
  <div class="section-title" style="margin:0 0 12px"><h3>飞书多维表格 ID 关联</h3><span class="chip ${linked?'green':'orange'}">${esc(statusMessage)}</span></div>
  <div class="data-note" style="margin-bottom:12px">请将七张 Excel 工作表导入同一份飞书多维表格。填写 App Token 和各表 ID 后，点击“保存配置并检查连接”。此处不填写 App Secret；所有正式操作通过企业后端授权。</div>
  <div class="form-group"><label>多维表格 App Token</label><input class="field" id="bitableAppToken" placeholder="bascnxxxxxxxx" value="${esc(cfg.appToken||'')}" autocomplete="off" spellcheck="false"/></div>
  <div class="form-grid" style="margin-top:9px">${fields}</div>
  <div class="action-row" style="margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn primary" data-action="bitable-save">保存配置并检查连接</button>
   <button class="btn" data-action="bitable-refresh">从飞书读取最新数据</button>
   <button class="btn" data-action="bitable-sync">同步本次修改</button>
   <button class="btn" data-action="bitable-copy">复制配置内容</button>
  </div>
  <p style="color:#718198;font-size:12px;margin-top:10px">在线身份由飞书登录决定；仅主管可管理表 ID。网页本地演示切换角色不具备生产权限。任务需要保存到飞书后才会发送提醒。</p>
  </section>${_baseFeishu()}`;
};
function collect(){return {appToken:$('#bitableAppToken')?.value.trim()||'',tables:Object.fromEntries(TABS.map(([k])=>[k,document.querySelector(`[data-bitable-table="${k}"]`)?.value.trim()||'']))}}
async function readCfg(){if(location.protocol==='file:'||!canManage())return;try{const x=await request('/api/bitable/config');state.bitableConfig={appToken:x.appToken||'',tables:x.tables||{}};if(state.view==='admin'&&state.adminTab==='data')buildPage()}catch{}}
async function saveConfig(){
 if(location.protocol==='file:')return toast('本地演示无法保存服务器配置，建议先复制配置内容提交企业IT');
 if(!canManage())return toast('仅主管可以保存配置');
 const x=collect();if(!x.appToken||Object.values(x.tables).some(v=>!v))return toast('请填写App Token及七张表的ID');
 try{await request('/api/bitable/config','POST',x);state.bitableConfig=x;const check=await request('/api/bitable/status');if(check.ready){toast('配置已保存，任务表已验证；正在加载七张表');await loadRemote()}else toast(check.message||'配置保存成功，但连接尚未通过');buildPage()}
 catch(e){toast('保存或验证失败：'+e.message)}
}
async function copyConfig(){const x=collect(),s=JSON.stringify(x,null,2);try{await navigator.clipboard.writeText(s);toast('配置已复制。无需发送App Secret')}catch{prompt('请复制以下配置（不含应用密钥）',s)}}
document.addEventListener('click',async e=>{
 const x=e.target.closest('[data-action]');if(!x||!String(x.dataset.action).startsWith('bitable-'))return;
 e.stopImmediatePropagation();e.preventDefault();
 if(!canManage())return toast('只有主管可以维护飞书数据配置');
 const a=x.dataset.action;
 if(a==='bitable-save')await saveConfig();
 if(a==='bitable-refresh')await loadRemote();
 if(a==='bitable-sync')await syncNow();
 if(a==='bitable-copy')await copyConfig();
},true);
async function boot(){
 if(!canUseFeishuBackend())return;
 try{let me=await request('/api/me');if(!me.authenticated)return;state.role=me.role==='supervisor'?'supervisor':'member';state.memberId=me.personId||state.memberId;state.csrf=me.csrf||'';state.identityMode='live';
 await readCfg();const st=await request('/api/bitable/status');if(st.ready)await loadRemote(true);else statusMessage='飞书表格未配置 / 未通过验证';buildPage();}catch(e){statusMessage='本地演示 · '+e.message}
}
boot();
})();

</script>
